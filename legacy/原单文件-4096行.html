/* =========================================================
   ★ 交互：拖动逻辑（优化）
   ========================================================= */
let drag = null;
let hover = null;      // 待放置组件的吸附落点 {x, y}

function snapshot(c){
  return {
    x: c.x, y: c.y, angle: c.angle, vAngle: c.vAngle, fieldAngle: c.fieldAngle,
    w: c.w, h: c.h, r: c.r, span: c.span, len: c.len,
    tv: c.tv ? c.tv.map(p => [p[0], p[1]]) : undefined
  };
}

/* 拖动被取消时回滚到按下时的快照 */
function restoreSnapshot(c, s){
  for (const k of ['x','y','angle','vAngle','fieldAngle','w','h','r','span','len']){
    if (s[k] !== undefined) c[k] = s[k];
  }
  if (s.tv) c.tv = s.tv.map(p => [p[0], p[1]]);
}

/* 悬停光标：按手柄类型给出方向提示 */
const HANDLE_CURSOR = {
  rot:'grab', dir:'grab', fdir:'grab', o1:'grab', o2:'grab',
  sx:'ew-resize', 'sx-':'ew-resize', sy:'ns-resize', 'sy-':'ns-resize',
  ne:'nesw-resize', sw:'nesw-resize', nw:'nwse-resize', se:'nwse-resize',
  r:'nwse-resize', sp1:'ew-resize', sp2:'ew-resize',
  v0:'grab', v1:'grab', v2:'grab',
};
function updateHoverCursor(sx, sy){
  const sel = (state.selection.length === 1) ? primaryComp() : null;
  let cur = '';
  if (sel && !state.pending){
    let bestD = 15, bestT = null;
    for (const pt of handlePoints(sel)){
      const [hx, hy] = w2s(pt.x, pt.y);
      const d = Math.hypot(hx - sx, hy - sy);
      if (d < bestD){ bestD = d; bestT = pt.type; }
    }
    if (bestT) cur = HANDLE_CURSOR[bestT] || 'pointer';
  }
  if (canvas.style.cursor !== cur) canvas.style.cursor = cur;
}

let propUpdateRaf = 0;
function schedulePropUpdate(){
  if (propUpdateRaf) return;
  propUpdateRaf = requestAnimationFrame(() => {
    propUpdateRaf = 0;
    buildPropPanel();
  });
}

canvas.addEventListener('pointerdown', (e) => {
  if (e.button === 2) return;
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  const [wx, wy] = s2w(sx, sy);
  const touch = e.pointerType === 'touch';
  const addKey = e.shiftKey || e.ctrlKey || e.metaKey;

  // 1) 手柄优先（触屏放大命中半径，避免点不中）
  const sel = (state.selection.length === 1) ? primaryComp() : null;
  if (sel && !state.pending){
    let best = null, bestD = 1e9;
    const base = touch ? 23 : 15;
    for (const pt of handlePoints(sel)){
      const [hx, hy] = w2s(pt.x, pt.y);
      const isBig = (pt.type === 'rot' || pt.type === 'r' || pt.type[0] === 'v');
      const R = isBig ? base : base - 2;
      const d = Math.hypot(hx - sx, hy - sy);
      if (d < R && d < bestD){ bestD = d; best = pt; }
    }
    if (best){
      drag = {
        type: 'handle', comp: sel, handleType: best.type,
        startScreen: [sx, sy], startWorld: [wx, wy],
        startComp: snapshot(sel), moved: false, touch
      };
      try { canvas.setPointerCapture(e.pointerId); } catch(_){}
      return;
    }
  }

  // 2) 放置待定组件（按吸附点落位）
  if (state.pending){
    const ghostComp = state.pending.cat === 'emitter' ? { kind:'emitter' } : null;
    const [px, py] = resolvePos(wx, wy, snap.on !== e.shiftKey, ghostComp);
    placeComponent(state.pending.cat, state.pending.key, px, py);
    state.pending = null;
    hover = null;
    guides = [];
    legend.querySelectorAll('.legendItem').forEach(x => x.classList.remove('on'));
    showHint('已放置，可在右上角调整属性');
    return;
  }

  // 3) 命中测试
  const hits = [];
  for (let i = state.components.length - 1; i >= 0; i--){
    const c = state.components[i];
    if (hitTest(c, wx, wy)) hits.push(c);
  }

  // 3a) Shift / Ctrl 点击：加入或移出多选
  if (addKey && hits.length){
    toggleSelect(hits[0].id);
    try { canvas.setPointerCapture(e.pointerId); } catch(_){}
    return;
  }

  if (hits.length === 0){
    if (e.shiftKey){
      // 空白 + Shift → 框选
      drag = { type:'marquee', startScreen:[sx, sy], startView:[view.cx, view.cy], moved:false, touch };
      marqueeRect = { x0: sx, y0: sy, x1: sx, y1: sy };
    } else {
      // 空白拖动 → 平移视图；空白单击 → 取消选中
      drag = { type:'empty', startScreen:[sx, sy], startView:[view.cx, view.cy], moved:false, touch };
      if (state.selection.length){
        state.selection = [];
        buildPropPanel();
        renderCompList();
      }
    }
  } else {
    // 已有多选且点在选中项上 → 整组拖动
    if (state.selection.length > 1 && hits.some(c => isSelected(c.id))){
      const items = selList().map(c => ({
        comp: c, sx: c.x, sy: c.y, snap: snapshot(c)
      }));
      drag = {
        type: 'multi', items,
        comp: hits.find(c => isSelected(c.id)),
        startScreen: [sx, sy], startWorld: [wx, wy], moved: false, touch
      };
    } else {
      let target;
      if (state.selectedId && hits.some(c => c.id === state.selectedId)){
        target = hits.find(c => c.id === state.selectedId);
      } else {
        target = hits[0];
      }
      drag = {
        type: 'body', comp: target, hits: hits,
        startScreen: [sx, sy], startWorld: [wx, wy],
        startComp: snapshot(target), moved: false, touch
      };
    }
  }
  try { canvas.setPointerCapture(e.pointerId); } catch(_){}
});

canvas.addEventListener('pointermove', (e) => {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  const [wx, wy] = s2w(sx, sy);
  const act = snap.on !== e.shiftKey;   // Shift 临时反转吸附

  // 无拖动时：更新悬停光标 + 待放置组件的吸附预览
  if (!drag){
    updateHoverCursor(sx, sy);
    if (state.pending){
      const ghostComp = state.pending.cat === 'emitter' ? { kind:'emitter' } : null;
      const [px, py] = resolvePos(wx, wy, act, ghostComp);
      hover = { x: px, y: py };
      showHud(e.clientX, e.clientY,
        `放置 <b>${pendingLabel(state.pending)}</b>` +
        `<br>X ${fmt2(px)} m　Y ${fmt2(py)} m${snapTag(act)}`);
    } else {
      if (hover) hover = null;
      if (guides.length) guides = [];
      hideHud();
    }
    return;
  }

  // 第一次超过拖动阈值时确定开始拖动（触屏阈值更大，避免误触发）
  if (!drag.moved){
    const th = drag.touch ? 7 : 4;
    const dxs = sx - drag.startScreen[0], dys = sy - drag.startScreen[1];
    if (Math.hypot(dxs, dys) < th) return;
    drag.moved = true;
    if (drag.type !== 'marquee'){
      canvas.classList.add('grabbing');
      canvas.style.cursor = 'grabbing';
    }

    if (drag.type === 'body' && state.selectedId !== drag.comp.id){
      state.selectedId = drag.comp.id;
      renderCompList();
      schedulePropUpdate();
    }
  }

  if (drag.type === 'handle'){
    boundarySnap = null;
    applyHandleDrag(drag, wx, wy, act);
    hudForHandle(drag, e.clientX, e.clientY, act);
    schedulePropUpdate();
  }
  else if (drag.type === 'body'){
    const c = drag.comp;
    const rawX = drag.startComp.x + (wx - drag.startWorld[0]);
    const rawY = drag.startComp.y + (wy - drag.startWorld[1]);
    const [px, py] = resolvePos(rawX, rawY, act, c, drag.startComp.x, drag.startComp.y);
    c.x = px; c.y = py;
    const tag = boundarySnap
      ? `<span class="tag">${boundarySnap.comp.name} 边界</span>`
      : snapTag(act);
    showHud(e.clientX, e.clientY,
      `X <b>${fmt2(c.x)}</b> m　Y <b>${fmt2(c.y)}</b> m${tag}`);
    schedulePropUpdate();
  }
  else if (drag.type === 'multi'){
    // 整组平移：以按下点为基准做快照位移，各自再吸附网格
    const dx = wx - drag.startWorld[0], dy = wy - drag.startWorld[1];
    for (const it of drag.items){
      const rx = it.sx + dx, ry = it.sy + dy;
      it.comp.x = act ? snapTo(rx, snap.step, it.sx) : rx;
      it.comp.y = act ? snapTo(ry, snap.step, it.sy) : ry;
    }
    guides = [];
    boundarySnap = null;
    showHud(e.clientX, e.clientY,
      `<b>${drag.items.length}</b> 个组件整体移动${snapTag(act)}`);
    schedulePropUpdate();
  }
  else if (drag.type === 'marquee'){
    marqueeRect = { x0: drag.startScreen[0], y0: drag.startScreen[1], x1: sx, y1: sy };
    hideHud();
  }
  else if (drag.type === 'empty'){
    // 空白处拖动 → 平移视图（保持按下点下的世界位置不漂移）
    view.cx = drag.startView[0] - (sx - drag.startScreen[0]) / SCALE;
    view.cy = drag.startView[1] + (sy - drag.startScreen[1]) / SCALE;
    guides = [];
    boundarySnap = null;
    hideHud();
  }
});

canvas.addEventListener('pointerleave', () => {
  if (!drag){ hover = null; guides = []; hideHud(); canvas.style.cursor = ''; }
});

/* 手柄拖动的读数 */
function hudForHandle(drag, cx, cy, act){
  const c = drag.comp, t = drag.handleType;
  const tag = snapTag(act);

  if (t === 'rot'){
    const deg = (c.angle * 180 / Math.PI + 360) % 360;
    showHud(cx, cy, `角度 <b>${deg.toFixed(1)}°</b>${act ? '<span class="tag">吸附 ' + snap.rotDeg + '°</span>' : ''}`);
    return;
  }
  if (t === 'dir'){
    const deg = (c.vAngle + 360) % 360;
    showHud(cx, cy, `发射角 <b>${deg.toFixed(1)}°</b>${act ? '<span class="tag">吸附 ' + snap.rotDeg + '°</span>' : ''}`);
    return;
  }
  if (t === 'fdir'){
    const deg = (c.fieldAngle * 180 / Math.PI + 360) % 360;
    showHud(cx, cy, `场方向 <b>${deg.toFixed(1)}°</b>${act ? '<span class="tag">吸附 5°</span>' : ''}`);
    return;
  }
  if (t === 'r'){
    showHud(cx, cy, `半径 <b>${c.r.toFixed(2)}</b> m${tag}`);
    return;
  }
  if (t === 'sp1' || t === 'sp2'){
    showHud(cx, cy, `张角 <b>${c.span.toFixed(0)}°</b>${tag}`);
    return;
  }
  if (t === 'v0' || t === 'v1' || t === 'v2'){
    const [lx, ly] = triVerts(c)[+t.slice(1)];
    showHud(cx, cy, `顶点 (${fmt2(lx)}, ${fmt2(ly)}) m<br>` +
      `底边 <b>${c.w.toFixed(2)}</b> m　高 <b>${c.h.toFixed(2)}</b> m${tag}`);
    return;
  }
  if (t === 'o1' || t === 'o2'){
    const deg = (c.angle * 180 / Math.PI + 360) % 360;
    showHud(cx, cy, `长度 <b>${c.len.toFixed(2)}</b> m　角度 <b>${deg.toFixed(1)}°</b>${tag}`);
    return;
  }
  // 角点 / 边中点
  showHud(cx, cy, `宽 <b>${c.w.toFixed(2)}</b> m　高 <b>${c.h.toFixed(2)}</b> m${tag}`);
}

/* 矩形：拖哪条边就只改哪一侧，对边为锚点，中心随之平移
   （角点则对角为锚点，两向同时伸缩） */
function resizeRectAnchored(drag, wx, wy, act){
  const s = drag.startComp;
  const c = drag.comp;
  const t = drag.handleType;
  const ca = Math.cos(s.angle), sa = Math.sin(s.angle);

  // 指针换算到「按下瞬间」的局部坐标
  const dx = wx - s.x, dy = wy - s.y;
  const lx =  dx*ca + dy*sa;
  const ly = -dx*sa + dy*ca;
  const snapv = (v, base) => act ? snapTo(v, snap.step, base) : v;
  const MIN = 0.3;

  let x0 = -s.w/2, x1 = s.w/2, y0 = -s.h/2, y1 = s.h/2;
  const east  = (t === 'sx' || t === 'ne' || t === 'se');
  const west  = (t === 'sx-' || t === 'nw' || t === 'sw');
  const north = (t === 'sy' || t === 'ne' || t === 'nw');
  const south = (t === 'sy-' || t === 'se' || t === 'sw');

  // 每条边以「按下时该边的位置」为基准做方向性截断：往外拖补足，往内拖减掉余数
  if (east)  x1 = Math.max(x0 + MIN, snapv(lx,  s.w/2));
  if (west)  x0 = Math.min(x1 - MIN, snapv(lx, -s.w/2));
  if (north) y1 = Math.max(y0 + MIN, snapv(ly,  s.h/2));
  if (south) y0 = Math.min(y1 - MIN, snapv(ly, -s.h/2));

  const nw = Math.max(MIN, x1 - x0);
  const nh = Math.max(MIN, y1 - y0);
  const ncx = (x0 + x1) / 2, ncy = (y0 + y1) / 2;

  c.w = nw;
  c.h = nh;
  c.x = s.x + ncx*ca - ncy*sa;
  c.y = s.y + ncx*sa + ncy*ca;
}

function applyHandleDrag(drag, wx, wy, act){
  const c = drag.comp;
  const s = drag.startComp;
  const t = drag.handleType;
  const snapOn = act;            // 吸附生效
  const free = !snapOn;

  // 半宽/半高吸附：中心在网格上时四边也落在网格
  // base = 按下时的半宽/半高，用于方向性截断（缩小减余数、放大的补足）
  const half = (v, min, base) => free ? Math.max(min, v)
    : Math.max(snap.step, snapTo(v, snap.step, base));

  /* ---------- 旋转（场 / 障碍通用，绕自身中心） ---------- */
  if (t === 'rot'){
    const dx = wx - c.x, dy = wy - c.y;
    if (Math.hypot(dx, dy) < 1e-6) return;
    // 0° = 本地 +x 轴；吸附时按 5° 递进并自动贴合正轴
    c.angle = snapAngle(Math.atan2(dy, dx), snapOn ? snap.rotDeg : 0);
    return;
  }

  /* ---------- 电场方向手柄 ---------- */
  if (t === 'fdir'){
    const dx = wx - c.x, dy = wy - c.y;
    if (Math.hypot(dx, dy) < 1e-6) return;
    c.fieldAngle = snapAngle(Math.atan2(dy, dx), snapOn ? 5 : 0);
    return;
  }

  /* ---------- 发射器方向手柄 ---------- */
  if (t === 'dir'){    const dx = wx - c.x, dy = wy - c.y;
    if (Math.hypot(dx, dy) < 1e-6) return;
    let deg = Math.atan2(dy, dx) * 180 / Math.PI;
    if (deg < 0) deg += 360;

    if (snapOn){
      deg = Math.round(deg / snap.rotDeg) * snap.rotDeg;
      // 贴在某个场边界上时，方向自动贴合「射入场内」的法线
      const hit = nearestFieldBoundary(c.x, c.y, 0.12, c.id);
      if (hit){
        const [ix, iy] = inwardDir(hit);
        const target = Math.atan2(iy, ix) * 180 / Math.PI;
        let d = Math.abs(((deg - target + 540) % 360) - 180);
        if (d < 10){
          deg = (target + 360) % 360;
          boundarySnap = { ...hit, dirOnly: true };
          showHint('发射方向已对齐 ' + hit.comp.name + ' 边界法线');
        }
      }
    }
    c.vAngle = ((deg % 360) + 360) % 360;
    return;
  }

  /* ---------- 障碍端点 ---------- */
  if (t === 'o1' || t === 'o2'){
    const h = s.len / 2;
    const cosA = Math.cos(s.angle), sinA = Math.sin(s.angle);
    const end1 = [s.x - h*cosA, s.y - h*sinA];  // o1
    const end2 = [s.x + h*cosA, s.y + h*sinA];  // o2

    const fixedEnd = (t === 'o1') ? end2 : end1;
    const startEnd = (t === 'o1') ? end1 : end2;   // 该端点的起始位置（方向性截断基准）
    const newEnd = snapEndpoint(fixedEnd, [wx, wy], snapOn, startEnd);

    const newLen = Math.hypot(newEnd[0] - fixedEnd[0], newEnd[1] - fixedEnd[1]);
    let newAngle;
    if (t === 'o1')
      newAngle = Math.atan2(fixedEnd[1] - newEnd[1], fixedEnd[0] - newEnd[0]);
    else
      newAngle = Math.atan2(newEnd[1] - fixedEnd[1], newEnd[0] - fixedEnd[0]);

    // 角度吸附后，以“固定端点”为锚重新求中心，保证另一端不漂移
    const a = snapAngle(newAngle, 0);
    const dirX = (t === 'o1') ? -Math.cos(a) : Math.cos(a);
    const dirY = (t === 'o1') ? -Math.sin(a) : Math.sin(a);
    const L = Math.max(0.3, newLen);

    c.len = L;
    c.angle = a;
    c.x = fixedEnd[0] + dirX * L / 2;
    c.y = fixedEnd[1] + dirY * L / 2;
    return;
  }

  /* ---------- 圆形 / 扇形半径 ---------- */
  if (t === 'r'){
    const [lx, ly] = toLocal(c, wx, wy);
    const v = Math.hypot(lx, ly);
    c.r = free ? Math.max(0.2, v) : Math.max(snap.step, snapTo(v, snap.step, s.r));
    return;
  }

  /* ---------- 扇形张角（对称张开） ---------- */
  if (t === 'sp1' || t === 'sp2'){
    const [lx, ly] = toLocal(c, wx, wy);
    if (Math.hypot(lx, ly) < 1e-6) return;
    let a = Math.abs(Math.atan2(ly, lx));            // 0 ~ π
    if (snapOn) a = Math.round(a / (5*Math.PI/180)) * (5*Math.PI/180);
    c.span = clamp(a * 360 / Math.PI, 6, 350);       // 单侧角×2
    return;
  }

  /* ---------- 三角形：直接拖顶点（拖动中中心不动，松手后重算中心） ---------- */
  if (t === 'v0' || t === 'v1' || t === 'v2'){
    const idx = +t.slice(1);
    const sv = triVerts(s);                       // 起始顶点（世界坐标作吸附基准）
    const [bx, by] = toWorld(s, sv[idx][0], sv[idx][1]);
    const px = snapOn ? snapTo(wx, snap.step, bx) : wx;
    const py = snapOn ? snapTo(wy, snap.step, by) : wy;
    const [lx, ly] = toLocal(c, px, py);
    const v = triVerts(c);
    v[idx][0] = lx;
    v[idx][1] = ly;
    updateTriBox(c);          // 同步包围盒（面板 / HUD 用）
    return;
  }

  /* ---------- 矩形：单侧伸缩 ---------- */
  if (c.shape === 'rect' &&
      (t === 'sx' || t === 'sx-' || t === 'sy' || t === 'sy-' ||
       t === 'ne' || t === 'nw' || t === 'se' || t === 'sw')){
    resizeRectAnchored(drag, wx, wy, act);
    return;
  }

  /* ---------- 角点：同时改宽高 ---------- */
  if (t === 'ne' || t === 'nw' || t === 'se' || t === 'sw'){
    const [lx, ly] = toLocal(c, wx, wy);
    const w = half(Math.abs(lx), 0.15, s.w/2) * 2;
    const h = half(Math.abs(ly), 0.15, s.h/2) * 2;
    c.w = Math.max(0.3, w);
    c.h = Math.max(0.3, h);
    return;
  }

  /* ---------- 边中点：只改一个方向 ---------- */
  if (t === 'sx' || t === 'sx-' || t === 'sy' || t === 'sy-'){
    const [lx, ly] = toLocal(c, wx, wy);
    const isAxisX = (t === 'sx' || t === 'sx-');

    if (c.shape === 'circle' || c.shape === 'sector'){
      const v = isAxisX ? Math.abs(lx) : Math.abs(ly);
      c.r = free ? Math.max(0.2, v) : Math.max(snap.step, snapTo(v, snap.step, s.r));
      return;
    }
    const baseHalf = (isAxisX ? s.w : s.h) / 2;
    const v = half(isAxisX ? Math.abs(lx) : Math.abs(ly), 0.15, baseHalf) * 2;
    if (isAxisX) c.w = Math.max(0.3, v);
    else         c.h = Math.max(0.3, v);
    return;
  }
}

function finishDrag(e, cancelled){
  canvas.classList.remove('grabbing');
  canvas.style.cursor = '';
  if (!drag) return;
  const d = drag;
  drag = null;
  guides = [];
  boundarySnap = null;
  hideHud();

  // 落位精度归一，避免浮点残值（如 1.4999999）
  if (d.type === 'body' && d.moved && d.comp){
    d.comp.x = Math.round(d.comp.x * 1e4) / 1e4;
    d.comp.y = Math.round(d.comp.y * 1e4) / 1e4;
  }
  if (d.type === 'multi' && d.moved){
    for (const it of d.items){
      it.comp.x = Math.round(it.comp.x * 1e4) / 1e4;
      it.comp.y = Math.round(it.comp.y * 1e4) / 1e4;
    }
  }
  // 三角形：顶点移动结束后以重心为新中心
  if (!cancelled && d.type === 'handle' && d.comp && d.comp.shape === 'triangle' &&
      d.handleType && d.handleType[0] === 'v'){
    recenterTriangle(d.comp);
  }
  if (!cancelled){
    if (d.type === 'marquee'){
      // 框选结算：与框有交集的组件（无限场不参与框选）
      if (d.moved && marqueeRect){
        const x0 = Math.min(marqueeRect.x0, marqueeRect.x1);
        const x1 = Math.max(marqueeRect.x0, marqueeRect.x1);
        const y0 = Math.min(marqueeRect.y0, marqueeRect.y1);
        const y1 = Math.max(marqueeRect.y0, marqueeRect.y1);
        const ids = [];
        for (const c of state.components){
          if (c.shape === 'infinite') continue;
          const b = compAABB(c);
          const [ax, ay] = w2s(b.x0, b.y1);
          const [bx, by] = w2s(b.x1, b.y0);
          const ix0 = Math.min(ax, bx), ix1 = Math.max(ax, bx);
          const iy0 = Math.min(ay, by), iy1 = Math.max(ay, by);
          if (ix1 >= x0 && ix0 <= x1 && iy1 >= y0 && iy0 <= y1) ids.push(c.id);
        }
        state.selection = ids;
        buildPropPanel();
        renderCompList();
        if (ids.length) showHint(`框选到 ${ids.length} 个组件`);
      }
    }
    else if (d.type === 'empty' && !d.moved){
      // 空白单击 → 取消选中
      if (state.selectedId !== null){
        state.selectedId = null;
        buildPropPanel();
        renderCompList();
      }
    }
    else if (d.type === 'body' && !d.moved){
      const hits = d.hits;
      // 多选状态下单击其中一个 → 收敛为单选
      if (state.selection.length > 1){
        state.selectedId = d.comp.id;
        buildPropPanel();
        renderCompList();
      } else {
        // 单击组件：同位置多层循环切换，到最底层取消选中
        const curIdx = hits.findIndex(c => c.id === state.selectedId);
        if (curIdx >= 0){
          if (hits.length === 1){
            state.selectedId = null;
          } else {
            state.selectedId = hits[(curIdx + 1) % hits.length].id;
          }
        } else {
          state.selectedId = hits[0].id;
        }
        buildPropPanel();
        renderCompList();
      }
    }
    else if (d.type === 'body' && d.moved){
      if (state.selectedId !== d.comp.id) state.selectedId = d.comp.id;
      buildPropPanel();
      renderCompList();
    }
    else if (d.type === 'multi' && d.moved){
      buildPropPanel();
      renderCompList();
    }
    else if (d.type === 'multi' && !d.moved){
      // 多选状态下单击其中一个 → 收敛为单选
      if (d.comp) state.selectedId = d.comp.id;
      buildPropPanel();
      renderCompList();
    }
    else if (d.type === 'handle'){
      buildPropPanel();
      renderCompList();
    }
  }

  marqueeRect = null;
  try { canvas.releasePointerCapture(e.pointerId); } catch(_){}
}

canvas.addEventListener('pointerup', (e) => finishDrag(e, false));
canvas.addEventListener('pointercancel', (e) => finishDrag(e, true));

/* =========================================================
   ★ 视图缩放 / 平移
   ========================================================= */
function updateZoomUI(){
  const z = document.getElementById('zoomVal');
  if (z) z.textContent = Math.round(SCALE) + '%';
}
function setScaleAt(ns, sx, sy){
  const [bx, by] = s2w(sx, sy);
  SCALE = clamp(ns, SCALE_MIN, SCALE_MAX);
  const [ax, ay] = s2w(sx, sy);
  view.cx += bx - ax;
  view.cy += by - ay;
  updateZoomUI();
}
function resetView(){ SCALE = 100; view.cx = 0; view.cy = 0; updateZoomUI(); }

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left, sy = e.clientY - rect.top;
  setScaleAt(SCALE * (e.deltaY > 0 ? 0.88 : 1.14), sx, sy);
}, { passive: false });

const zoomSeg = document.getElementById('zoomSeg');
if (zoomSeg){
  zoomSeg.querySelectorAll('[data-z]').forEach(b => {
    b.onclick = () => {
      const z = b.dataset.z;
      if (z === 'in') setScaleAt(SCALE * 1.25, W/2, H/2);
      else if (z === 'out') setScaleAt(SCALE * 0.8, W/2, H/2);
      else resetView();
    };
  });
}
updateZoomUI();

/* =========================================================
   ★ 吸附控件
   ========================================================= */
const snapToggleEl = document.getElementById('snapToggle');
const snapSegEl = document.getElementById('snapSeg');

function updateSnapUI(){
  if (snapToggleEl){
    snapToggleEl.classList.toggle('on', snap.on);
    snapToggleEl.textContent = snap.on ? '开' : '关';
  }
  if (snapSegEl){
    snapSegEl.classList.toggle('on', snap.on);
    snapSegEl.querySelectorAll('[data-step]').forEach(b => {
      b.classList.toggle('on', Math.abs(parseFloat(b.dataset.step) - snap.step) < 1e-6);
    });
  }
}

if (snapToggleEl){
  snapToggleEl.onclick = () => {
    snap.on = !snap.on;
    guides = [];
    updateSnapUI();
    showHint(snap.on
      ? `网格吸附已开启（${snap.step} m），按住 Shift 可临时关闭`
      : '网格吸附已关闭，按住 Shift 可临时开启');
  };
}
if (snapSegEl){
  snapSegEl.querySelectorAll('[data-step]').forEach(b => {
    b.onclick = () => {
      snap.step = parseFloat(b.dataset.step);
      guides = [];
      updateSnapUI();
    };
  });
}
updateSnapUI();

/* =========================================================
   ★ 命中测试（优化：单边 / 无限场）
   ========================================================= */
function hitTest(c, wx, wy){
  if (c.kind === 'field' || c.kind === 'negfield'){
    // 无限场覆盖全屏，无法通过点击精确选中，只能从列表选择
    if (c.shape === 'infinite') return false;

    // 单边界：右侧半平面均可点中，边界线左侧 0.25m 内也视为命中
    if (c.shape === 'single'){
      const [lx] = toLocal(c, wx, wy);
      return lx > -0.25;
    }
    // 双边界：整个竖直带范围，外扩 0.25m
    if (c.shape === 'double'){
      const [lx] = toLocal(c, wx, wy);
      return Math.abs(lx) < c.w / 2 + 0.25;
    }
    // 单边界有限：右侧矩形带，外扩 0.25m
    if (c.shape === 'singleFinite'){
      const [lx, ly] = toLocal(c, wx, wy);
      return lx > -0.25 && Math.abs(ly) < c.h / 2 + 0.25;
    }
    return insideShape(c, wx, wy);
  }
  if (c.kind === 'obstacle'){
    const dx = Math.cos(c.angle)*c.len/2;
    const dy = Math.sin(c.angle)*c.len/2;
    return distToSeg(wx, wy, c.x-dx, c.y-dy, c.x+dx, c.y+dy) < 0.2;
  }
  if (c.kind === 'emitter'){
    return Math.hypot(wx - c.x, wy - c.y) < 0.32;
  }
  return false;
}

function distToSeg(px, py, x1, y1, x2, y2){
  const dx = x2-x1, dy = y2-y1;
  const l2 = dx*dx + dy*dy;
  if (l2 === 0) return Math.hypot(px-x1, py-y1);
  let t = ((px-x1)*dx + (py-y1)*dy) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (x1+t*dx), py - (y1+t*dy));
}

/* =========================================================
   属性面板
   ========================================================= */
const propPanel = document.getElementById('propPanel');
const propBody   = document.getElementById('propBody');
const propTitle  = document.getElementById('propTitle');
const propKind   = document.getElementById('propKind');

function el(tag, cls){
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  return e;
}

function segCtrl(options, value, onChange){
  const wrap = el('div','seg');
  const btns = [];
  options.forEach(o => {
    const b = el('button','segBtn');
    b.textContent = o.label;
    if (o.value === value) b.classList.add('on');
    b.onclick = () => {
      btns.forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      onChange(o.value);
    };
    wrap.appendChild(b);
    btns.push(b);
  });
  return wrap;
}

function logSliderCtrl(min, max, value, onChange, fmt){
  const wrap = el('div','sliderWrap');
  const input = el('input');
  input.type = 'range'; input.min = 0; input.max = 1000;
  const toS = v => Math.round(Math.log(v/min) / Math.log(max/min) * 1000);
  const toV = s => min * Math.pow(max/min, s/1000);
  input.value = toS(value);
  const out = el('span','sliderVal');
  out.textContent = fmt(value);
  input.oninput = () => {
    const v = toV(parseFloat(input.value));
    out.textContent = fmt(v);
    onChange(v);
  };
  wrap.append(input, out);
  return wrap;
}

function sliderCtrl(min, max, value, onChange, fmt){
  const wrap = el('div','sliderWrap');
  const input = el('input');
  input.type = 'range'; input.min = min; input.max = max;
  input.step = (max - min) / 500;
  input.value = value;
  const out = el('span','sliderVal');
  out.textContent = fmt(value);
  input.oninput = () => {
    const v = parseFloat(input.value);
    out.textContent = fmt(v);
    onChange(v);
  };
  wrap.append(input, out);
  return wrap;
}

/* 角度控件：滑杆 + 可直接输入的角度框（0~360 循环） */
function angleSlider(deg, onChange){
  const start = ((deg % 360) + 360) % 360;
  const wrap = el('div','sliderWrap');
  const range = el('input');
  range.type = 'range'; range.min = 0; range.max = 360; range.step = 1;
  range.value = start;
  const num = el('input');
  num.type = 'number'; num.className = 'numMini';
  num.min = 0; num.max = 360; num.step = 1;
  num.value = Math.round(start * 10) / 10;

  range.oninput = () => {
    const v = parseFloat(range.value);
    num.value = Math.round(v * 10) / 10;
    onChange(v);
  };
  num.oninput = () => {
    let v = parseFloat(num.value);
    if (isNaN(v)) return;
    v = ((v % 360) + 360) % 360;
    range.value = v;
    onChange(v);
  };
  wrap.append(range, num);
  return wrap;
}

function numCtrl(value, onChange, unit){
  const wrap = el('div','numWrap');
  const input = el('input');
  input.type = 'number'; input.value = value;
  input.oninput = () => {
    const v = parseFloat(input.value);
    if (!isNaN(v)) onChange(v);
  };
  wrap.appendChild(input);
  if (unit){
    const u = el('span','unit');
    u.textContent = unit;
    wrap.appendChild(u);
  }
  return wrap;
}

function row(label, node, extra){
  const r = el('div','row');
  const l = el('div','rowLabel');
  l.textContent = label;
  if (extra){
    const b = el('b'); b.textContent = extra; l.appendChild(b);
  }
  r.appendChild(l);
  r.appendChild(node);
  return r;
}

function sectionTitle(text){
  const d = el('div','sectionTitle');
  d.textContent = text;
  return d;
}

/* 位置 X / Y 并排，版面更匀称 */
function posGrid(c){
  const wrap = el('div','posGrid');
  const mk = (lab, val, on) => {
    const cell = el('div','posCell');
    const s = el('span'); s.textContent = lab;
    const inp = el('input');
    inp.type = 'number'; inp.step = '0.1'; inp.value = round2(val);
    inp.oninput = () => { const v = parseFloat(inp.value); if (!isNaN(v)) on(v); };
    const u = el('span','u'); u.textContent = 'm';
    cell.append(s, inp, u);
    return cell;
  };
  wrap.appendChild(mk('X', c.x, v => c.x = v));
  wrap.appendChild(mk('Y', c.y, v => c.y = v));
  return wrap;
}

function deleteBtn(c){
  const b = el('button','delBtn');
  b.textContent = '删除该组件';
  b.onclick = () => deleteComp(c);
  return b;
}

function dotColor(c){
  if (c.kind === 'field') return c.fieldType === 'E' ? tc('#f59e0b') : tc('#38bdf8');
  if (c.kind === 'negfield') return theme.light ? '#475569' : '#94a3b8';
  if (c.kind === 'obstacle') return theme.light ? '#334155' : '#e2e8f0';
  return theme.light ? shade(c.color, 0.8) : c.color;
}

function buildPropPanel(){
  const keepScroll = propBody.scrollTop;
  propBody.innerHTML = '';

  const list = selList();
  if (list.length === 0){
    propPanel.style.display = 'none';
    propTitle.textContent = '属性';
    if (propKind) propKind.textContent = '';
    return;
  }
  propPanel.style.display = 'flex';

  if (list.length > 1){
    propTitle.textContent = '多选';
    if (propKind) propKind.textContent = list.length + ' 项';
    buildMultiProps(list);
    propBody.scrollTop = keepScroll;
    return;
  }

  const c = list[0];
  propTitle.textContent = c.name;
  if (propKind) propKind.textContent =
    c.kind === 'field' ? '电场/磁场' :
    c.kind === 'negfield' ? '负场' :
    c.kind === 'obstacle' ? '障碍' : '发射器';

  if (c.kind === 'field') buildFieldProps(c);
  else if (c.kind === 'negfield') buildNegFieldProps(c);
  else if (c.kind === 'obstacle') buildObstacleProps(c);
  else if (c.kind === 'emitter') buildEmitterProps(c);

  propBody.appendChild(deleteBtn(c));
  propBody.scrollTop = keepScroll;
}

/* ---------- 多选批量面板 ---------- */
function buildMultiProps(list){
  const head = el('div');
  head.style.cssText = 'display:flex;align-items:baseline;gap:8px;margin-bottom:10px;';
  head.innerHTML = `<span class="multiCount">${list.length}</span>
    <span style="font-size:11.5px;color:var(--txt4)">个组件已选中，可整体拖动 / 对齐 / 删除</span>`;
  propBody.appendChild(head);

  // 名称清单
  const names = el('div','multiList');
  for (const c of list){
    const r = el('div','compItem');
    r.style.padding = '5px 8px';
    const dot = el('span','dot');
    dot.style.background = dotColor(c);
    const nm = el('span','nm');
    nm.textContent = c.name;
    r.append(dot, nm);
    names.appendChild(r);
  }
  propBody.appendChild(names);

  propBody.appendChild(sectionTitle('对齐'));
  const row1 = el('div','multiRow');
  [['左', 'left'], ['水平居中', 'cx'], ['右', 'right']].forEach(([label, mode]) => {
    const b = el('button','mBtn');
    b.textContent = label;
    b.onclick = () => { alignSelection(mode); buildPropPanel(); };
    row1.appendChild(b);
  });
  const row2 = el('div','multiRow');
  [['上', 'top'], ['垂直居中', 'cy'], ['下', 'bottom']].forEach(([label, mode]) => {
    const b = el('button','mBtn');
    b.textContent = label;
    b.onclick = () => { alignSelection(mode); buildPropPanel(); };
    row2.appendChild(b);
  });
  propBody.appendChild(row1);
  propBody.appendChild(row2);

  const same = el('button','mBtn');
  same.style.cssText = 'width:100%;padding:8px 0;margin-top:2px;';
  same.textContent = '等间距分布（水平 / 垂直自适应）';
  same.onclick = () => { distributeSelection(); buildPropPanel(); };
  propBody.appendChild(same);

  const del = el('button','delBtn');
  del.textContent = `删除这 ${list.length} 个组件`;
  del.onclick = () => {

    buildPropPanel();
    renderCompList();

}

function alignSelection(mode){
  const list = selList();
  if (list.length < 2) return;
  const xs = list.map(c => c.x), ys = list.map(c => c.y);
  const cx = (Math.min(...xs) + Math.max(...xs)) / 2;
  const cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  for (const c of list){
    if (mode === 'left')  c.x = Math.min(...xs);
    if (mode === 'right') c.x = Math.max(...xs);
    if (mode === 'cx')    c.x = cx;
    if (mode === 'top')    c.y = Math.max(...ys);
    if (mode === 'bottom') c.y = Math.min(...ys);
    if (mode === 'cy')    c.y = cy;
  }
  guides = [];
}

/* 等间距：元素多于 2 个时按中心沿跨度较大的轴均匀分布 */
function distributeSelection(){
  const list = selList();
  if (list.length < 3) return;
  const xs = list.map(c => c.x), ys = list.map(c => c.y);
  const spanX = Math.max(...xs) - Math.min(...xs);
  const spanY = Math.max(...ys) - Math.min(...ys);
  const axis = spanX >= spanY ? 'x' : 'y';
  const arr = list.slice().sort((a, b) => a[axis] - b[axis]);
  const first = arr[0][axis], last = arr[arr.length - 1][axis];
  const step = (last - first) / (arr.length - 1);
  arr.forEach((c, i) => { c[axis] = first + step * i; });
}

function buildFieldProps(c){

    }
  )));

  if (c.fieldType === 'E'){

      c.fieldAngle * 180 / Math.PI,

  const preset = c.fieldType === 'E' ? E_PRESET : B_PRESET;

  const unit = c.fieldType === 'E' ? 'N/C' : 'T';

  function matchPreset(v){
    if (Math.abs(v - preset.weak) < 1e-9) return 'weak';
    if (Math.abs(v - preset.mid) < 1e-9) return 'mid';
    if (Math.abs(v - preset.strong) < 1e-9) return 'strong';
    return null;
  }

  const segWrap = segCtrl(
    [
      {label:'弱', value:'weak'},
      {label:'中', value:'mid'},
      {label:'强', value:'strong'},
    ],
    matchPreset(c.strength),
    v => {
      c.strength = preset[v];
      buildPropPanel();
    }
  );

  if (!matchPreset(c.strength)){
    segWrap.querySelectorAll('.segBtn').forEach(b => b.classList.remove('on'));
    const tag = el('span');
    tag.textContent = '自定义';

    v => { c.angle = v * Math.PI/180; }
  )));

  propBody.appendChild(row('位置', posGrid(c)));
}

   组件列表
   ========================================================= */
const listPanel = document.getElementById('listPanel');
const listBody = document.getElementById('listBody');

function deleteComp(c){
  const i = state.components.indexOf(c);
  if (i >= 0) state.components.splice(i, 1);
  state.selection = state.selection.filter(id => id !== c.id);
  if (drag && drag.comp === c) drag = null;
  buildPropPanel();
  renderCompList();
}

function renderCompList(){
  listBody.innerHTML = '';
  if (state.components.length === 0){
    const t = el('div','emptyTip');
    t.textContent = '暂无组件';
    listBody.appendChild(t);
    return;
  }
  state.components.forEach(c => {
    const item = el('div','compItem');
    if (isSelected(c.id)) item.classList.add('on');

    const dot = el('span','dot');
    dot.style.background = dotColor(c);

    const nm = el('span','nm');
    nm.textContent = c.name;

    const x = el('span','x');
    x.textContent = '×';
    x.onclick = (e) => {
      e.stopPropagation();
      deleteComp(c);
    };

    item.append(dot, nm, x);
    // Shift / Ctrl 点击 = 多选
    item.onclick = (e) => {
      if (e.shiftKey || e.ctrlKey || e.metaKey) toggleSelect(c.id);
      else selectComponent(c.id);
    };
    listBody.appendChild(item);
  });
}

/* =========================================================
   键盘快捷键
   ========================================================= */
window.addEventListener('keydown', (e) => {
  // 在输入框内输入时不触发画布快捷键
  const tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;

  if (e.code === 'Space'){
    e.preventDefault();
    state.running = !state.running;
    updatePlayBtn();
  }
  if (e.key === '+' || e.key === '=' || e.code === 'NumpadAdd'){
    e.preventDefault(); setScaleAt(SCALE * 1.2, W/2, H/2);
  }
  if (e.key === '-' || e.key === '_' || e.code === 'NumpadSubtract'){
    e.preventDefault(); setScaleAt(SCALE * 0.8, W/2, H/2);
  }
  if (e.key === '0'){ resetView(); }
  if (e.key === 'g' || e.key === 'G'){
    snap.on = !snap.on;
    guides = [];
    updateSnapUI();
    showHint(snap.on ? `网格吸附：开（${snap.step} m）` : '网格吸附：关');
  }
  if (e.code === 'Escape' && drag){
    // 拖动中按 Esc：回滚到按下时的状态
    const d = drag;
    drag = null;
    if (d.comp && d.startComp) restoreSnapshot(d.comp, d.startComp);
    if (d.type === 'multi' && d.items){
      for (const it of d.items){
        it.comp.x = it.sx;
        it.comp.y = it.sy;
        if (it.snap) restoreSnapshot(it.comp, it.snap);
      }
    }
    guides = [];
    boundarySnap = null;
    hideHud();
    canvas.classList.remove('grabbing');
    canvas.style.cursor = '';
    buildPropPanel();
    renderCompList();
    return;
  }
  if (e.code === 'Escape'){
    state.pending = null;
    state.selectedId = null;
    hover = null;
    marqueeRect = null;
    guides = [];
    hideHud();
    legend.querySelectorAll('.legendItem').forEach(x => x.classList.remove('on'));
    buildPropPanel();
    renderCompList();
  }
  if ((e.key === 'a' || e.key === 'A') && (e.ctrlKey || e.metaKey)){
    e.preventDefault();
    state.selection = state.components.map(c => c.id);
    buildPropPanel();
    renderCompList();
    return;
  }
  if (e.code === 'Delete' || e.code === 'Backspace'){
    if (state.selection.length){
      const ids = state.selection.slice();
      state.components = state.components.filter(c => ids.indexOf(c.id) < 0);
      state.selection = [];
      buildPropPanel();
      renderCompList();
    }
  }
  if (e.key === 't' || e.key === 'T'){ applyTheme(!theme.light); }
});

/* =========================================================
   面板：折叠 / 拖动 / 复位
   ========================================================= */
const PANEL_IDS = ['leftPanel', 'propPanel', 'listPanel', 'viewPanel'];

function makePanelDraggable(p){
  const head = p.querySelector('.panelHead');
  if (!head) return;
  let d = null;

  head.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;      // 折叠按钮不触发拖动
    const r = p.getBoundingClientRect();
    d = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    p.style.left = r.left + 'px';
    p.style.top = r.top + 'px';
    p.style.right = 'auto';
    p.style.bottom = 'auto';
    p.classList.add('dragging');
    try { head.setPointerCapture(e.pointerId); } catch(_){}
  });

  head.addEventListener('pointermove', (e) => {
    if (!d) return;
    const w = p.offsetWidth || 200;
    const x = clamp(e.clientX - d.dx, 4, Math.max(4, window.innerWidth - w - 4));
    const y = clamp(e.clientY - d.dy, 4, Math.max(4, window.innerHeight - 40));
    p.style.left = x + 'px';
    p.style.top = y + 'px';
  });

  const end = (e) => {
    if (!d) return;
    d = null;
    p.classList.remove('dragging');
    try { head.releasePointerCapture(e.pointerId); } catch(_){}
  };
  head.addEventListener('pointerup', end);
  head.addEventListener('pointercancel', end);
}

/* 折叠 / 展开动画：先锁住当前高度，再过渡到目标高度，动画结束后交还给 CSS */
const COLLAPSE_MS = 260;

function setPanelCollapsed(p, collapse, animate){
  const body = p.querySelector('.panelBody');
  if (!body) return;
  const cur = p.classList.contains('collapsed');
  if (animate === false || collapse === cur){
    p.classList.toggle('collapsed', !!collapse);
    body.style.height = '';
    body.style.overflow = '';
    body.style.opacity = '';
    return;
  }
  clearTimeout(body._collapseTimer);

  if (collapse){
    const h0 = body.getBoundingClientRect().height;
    body.style.overflow = 'hidden';
    body.style.height = h0 + 'px';
    void body.offsetHeight;                 // 让起始高度落地
    p.classList.add('collapsed');           // CSS 用 !important 把高度压到 0 → 触发过渡
    body._collapseTimer = setTimeout(() => {
      body.style.height = '';
      body.style.overflow = '';
    }, COLLAPSE_MS + 80);
  } else {
    p.classList.remove('collapsed');
    const target = body.scrollHeight;
    body.style.overflow = 'hidden';
    body.style.height = '0px';
    void body.offsetHeight;
    body.style.height = target + 'px';
    body._collapseTimer = setTimeout(() => {
      body.style.height = '';
      body.style.overflow = '';
    }, COLLAPSE_MS + 80);
  }
}

function initPanels(){
  for (const id of PANEL_IDS){
    const p = document.getElementById(id);
    if (!p) continue;
    const chev = p.querySelector('.chev');
    if (chev){
      chev.addEventListener('click', (e) => {
        e.stopPropagation();
        setPanelCollapsed(p, !p.classList.contains('collapsed'));
      });
    }
    makePanelDraggable(p);
  }
}

function resetLayout(){
  for (const id of PANEL_IDS){
    const p = document.getElementById(id);
    if (!p) continue;
    p.style.left = p.style.top = p.style.right = p.style.bottom = '';
    setPanelCollapsed(p, false, false);
  }
  buildPropPanel();
  showHint('面板布局已复位');
}

/* =========================================================
   主题切换
   ========================================================= */
const themeBtn = document.getElementById('themeBtn');

function applyTheme(light, silent){
  theme.light = !!light;
  document.body.classList.toggle('light', theme.light);
  document.documentElement.classList.toggle('light', theme.light);

  // 发射器 / 粒子颜色跟随主题（色板有两套）
  for (const c of state.components){
    if (c.kind === 'emitter' && typeof c.cidx === 'number') c.color = palColor(c.cidx);
  }
  const map = {};
  for (const c of state.components){
    if (c.kind === 'emitter') map[c.id] = c.color;
  }
  for (const pt of particles){
    if (map[pt.emitterId]) pt.color = map[pt.emitterId];
  }

  if (themeBtn){
    themeBtn.textContent = theme.light ? '☾' : '☀';
    themeBtn.title = theme.light ? '切换到暗色主题（T）' : '切换到亮色主题（T）';
  }
  try { localStorage.setItem('simTheme', theme.light ? 'light' : 'dark'); } catch(_){}

  if (!silent) showHint(theme.light ? '已切换到亮色主题' : '已切换到暗色主题');
  buildPropPanel();
  renderCompList();
}

if (themeBtn) themeBtn.onclick = () => applyTheme(!theme.light);

const layoutBtn = document.getElementById('layoutBtn');
if (layoutBtn) layoutBtn.onclick = resetLayout;

/* 画布右键不弹菜单（拖动更顺手） */
canvas.addEventListener('contextmenu', e => e.preventDefault());

/* =========================================================
   启动
   ========================================================= */
initPanels();

(function initTheme(){
  let saved = null;
  try { saved = localStorage.getItem('simTheme'); } catch(_){}
  applyTheme(saved === 'light', true);
})();

updatePlayBtn();
renderCompList();
buildPropPanel();
requestAnimationFrame(loop);
