<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>带电粒子偏转模拟</title>
<style>
  /* ===================== 主题变量 ===================== */
  :root{
    --bg:#0b1120;
    --panel:rgba(15,23,42,.9);
    --panelSoft:rgba(15,23,42,.85);
    --ctl:rgba(30,41,59,.9);
    --ctlSoft:rgba(51,65,85,.55);
    --ctlHover:rgba(51,65,85,.95);
    --txt:#e2e8f0; --txt2:#cbd5e1; --txt3:#94a3b8; --txt4:#64748b; --txt5:#475569;
    --dim:#8595ad;
    --bd:rgba(148,163,184,.18); --bd2:rgba(148,163,184,.22); --bd3:rgba(148,163,184,.12);
    --accent:#38bdf8; --accent2:#7dd3fc; --blue:#2563eb;
    --hudBg:rgba(8,14,28,.9); --hudBd:rgba(56,189,248,.35);
    --track:rgba(148,163,184,.25);
    --grade:rgba(148,163,184,.35);
    --shadow:0 8px 30px rgba(0,0,0,.45);
    --thumbBd:#fff;
    --inputBg:rgba(30,41,59,.9);
    /* 滚动条 */
    --sb:rgba(148,163,184,.28);
    --sbHover:rgba(148,163,184,.52);
    --sbActive:rgba(56,189,248,.55);
    /* 面板标题栏 / 分隔 */
    --headBg:rgba(15,23,42,.55);
    --segBg:rgba(2,6,23,.55);
    --ease:cubic-bezier(.32,.72,.28,1);
  }
  body.light,html.light{
    --bg:#eef2f7;
    --panel:rgba(255,255,255,.95);
    --panelSoft:rgba(255,255,255,.92);
    --ctl:rgba(241,245,249,.96);
    --ctlSoft:rgba(226,232,240,.9);
    --ctlHover:rgba(203,213,225,.95);
    --txt:#0f172a; --txt2:#1e293b; --txt3:#475569; --txt4:#64748b; --txt5:#94a3b8;
    --dim:#5c6c82;
    --bd:rgba(15,23,42,.12); --bd2:rgba(15,23,42,.2); --bd3:rgba(15,23,42,.08);
    --accent:#0284c7; --accent2:#0369a1; --blue:#2563eb;
    --hudBg:rgba(255,255,255,.97); --hudBd:rgba(2,132,199,.42);
    --track:rgba(100,116,139,.28);
    --grade:rgba(100,116,139,.45);
    --shadow:0 8px 26px rgba(15,23,42,.14);
    --inputBg:rgba(241,245,249,.96);
    /* 滚动条 */
    --sb:rgba(100,116,139,.30);
    --sbHover:rgba(100,116,139,.55);
    --sbActive:rgba(2,132,199,.6);
    /* 面板标题栏 / 分隔 */
    --headBg:rgba(241,245,249,.72);
    --segBg:rgba(226,232,240,.7);
    --ease:cubic-bezier(.32,.72,.28,1);
  }

  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);
    font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
    color:var(--txt);user-select:none;overscroll-behavior:none;
    transition:background .18s,color .18s}
  input{user-select:text}
  canvas{position:fixed;inset:0;display:block;cursor:crosshair;touch-action:none}

  /* ===================== 滚动条（全局统一） ===================== */
  *{scrollbar-width:thin;scrollbar-color:var(--sb) transparent}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent;border-radius:99px}
  ::-webkit-scrollbar-thumb{background:var(--sb);border-radius:99px;
    border:2px solid transparent;background-clip:content-box}
  ::-webkit-scrollbar-thumb:hover{background:var(--sbHover);background-clip:content-box}
  ::-webkit-scrollbar-thumb:active{background:var(--sbActive);background-clip:content-box}
  ::-webkit-scrollbar-corner{background:transparent}

  /* ===================== 面板通用 ===================== */
  .panel{position:fixed;background:var(--panel);backdrop-filter:blur(14px) saturate(1.15);
    -webkit-backdrop-filter:blur(14px) saturate(1.15);
    border:1px solid var(--bd);border-radius:13px;box-shadow:var(--shadow);z-index:10;
    display:flex;flex-direction:column;overflow:hidden;
    transition:box-shadow .18s var(--ease),background .18s,border-color .18s}
  .panel.dragging{box-shadow:0 18px 46px rgba(0,0,0,.42);z-index:24;transition:none}
  .panelHead{display:flex;align-items:center;justify-content:space-between;gap:8px;
    height:36px;padding:0 8px 0 12px;font-size:12.5px;font-weight:600;color:var(--txt2);
    background:var(--headBg);border-bottom:1px solid var(--bd3);
    cursor:grab;touch-action:none;flex-shrink:0;
    transition:background .18s,border-color .18s}
  .panelHead:active{cursor:grabbing}
  .panelHead .ttl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .panelHead small{font-size:10.5px;font-weight:400;color:var(--dim);flex-shrink:0}
  .chev{width:22px;height:22px;border-radius:6px;border:1px solid transparent;
    background:transparent;color:var(--txt4);font-size:9px;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;line-height:1;
    transition:transform .24s var(--ease),color .16s,background .16s,border-color .16s}
  .chev:hover{color:var(--txt2);background:var(--ctl);border-color:var(--bd)}
  .panel.collapsed .chev{transform:rotate(-90deg)}
  /* 折叠 / 展开：靠高度过渡做动画，不再 display:none 硬切 */
  .panelBody{display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain;
    touch-action:pan-y;padding:8px 9px 9px;min-height:0;scrollbar-gutter:stable;
    transition:height .26s var(--ease),opacity .2s var(--ease),
      padding .26s var(--ease),background .18s}
  .panel.collapsed .panelBody{height:0!important;padding-top:0;padding-bottom:0;
    opacity:0;overflow:hidden;pointer-events:none}

  /* ===================== 左上：类别（横排）与子组件（纵排） ===================== */
  #leftPanel{left:12px;top:12px;width:214px;max-height:calc(100vh - 310px)}
  #leftPanel .panelBody{gap:8px}
  .catRow{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .catBtn{padding:7px 0;border-radius:8px;border:1px solid var(--bd2);
    background:var(--ctlSoft);color:var(--txt2);font-size:13px;cursor:pointer;
    text-align:center;font-weight:500;touch-action:manipulation;
    transition:background .16s var(--ease),color .16s,border-color .16s,transform .1s}
  .catBtn:hover{background:var(--ctlHover);color:var(--txt);border-color:var(--bd2)}
  .catBtn:active{transform:scale(.95)}
  .catBtn.on{background:var(--blue);border-color:#3b82f6;color:#fff;
    box-shadow:0 3px 12px rgba(37,99,235,.32)}

  @keyframes legendIn{from{opacity:0}to{opacity:1}}
  #legend{display:flex;flex-direction:column;gap:3px}
  #legend:empty{display:none}
  .legendItem{display:flex;align-items:center;gap:7px;padding:7px 9px;
    border-radius:8px;font-size:12.5px;cursor:pointer;
    background:transparent;border:1px solid transparent;
    color:var(--txt2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    touch-action:manipulation;animation:legendIn .2s var(--ease) both;
    transition:background .15s var(--ease),color .15s,border-color .15s,transform .1s}
  .legendItem::before{content:'';width:5px;height:5px;border-radius:50%;
    background:var(--txt5);flex-shrink:0;transition:.15s}
  .legendItem:hover{background:var(--ctlSoft);color:var(--txt);border-color:var(--bd3)}
  .legendItem:active{transform:scale(.985)}
  .legendItem:hover::before{background:var(--accent)}
  .legendItem.on{background:rgba(14,165,233,.16);color:var(--accent2);
    border-color:rgba(56,189,248,.42)}
  .legendItem.on::before{background:var(--accent);box-shadow:0 0 6px var(--accent)}

  /* ===================== 右上：属性面板 ===================== */
  #propPanel{right:12px;top:56px;width:296px;
    max-height:calc(100vh - 320px);display:none}
  #propPanel .panelBody{padding:8px 12px 12px;overflow-y:auto}
  .row{margin-bottom:11px}
  .rowLabel{font-size:12px;color:var(--txt3);margin-bottom:5px;display:flex;
    justify-content:space-between;align-items:center}
  .rowLabel b{color:var(--accent);font-weight:500}

  .seg{display:flex;background:var(--segBg);border:1px solid var(--bd3);
    border-radius:9px;padding:2px;gap:2px;flex-wrap:wrap}
  .segBtn{flex:1;min-width:0;padding:6px 2px;border:none;border-radius:7px;background:transparent;
    color:var(--txt3);font-size:12px;cursor:pointer;white-space:nowrap;
    touch-action:manipulation;
    transition:background .16s var(--ease),color .16s,box-shadow .16s}
  .segBtn:hover{color:var(--txt);background:var(--ctlSoft)}
  .segBtn.on{background:var(--blue);color:#fff;font-weight:500;
    box-shadow:0 2px 9px rgba(37,99,235,.32)}

  .sliderWrap{display:flex;align-items:center;gap:8px}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:5px;border-radius:3px;
    background:var(--track);outline:none;cursor:pointer;touch-action:none}
  input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;
    background:transparent}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;
    border-radius:50%;background:var(--accent);cursor:pointer;
    box-shadow:0 0 6px rgba(56,189,248,.55);border:2px solid var(--thumbBd)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;
    background:var(--accent);cursor:pointer;border:2px solid var(--thumbBd)}
  input[type=range]::-moz-range-track{background:var(--track);height:5px;border-radius:3px}
  .sliderVal{font-size:12px;color:var(--accent);min-width:52px;text-align:right;
    font-variant-numeric:tabular-nums}
  .numMini{flex:0 0 60px;width:60px;padding:4px 6px;font-size:12px;text-align:right;
    border-radius:6px;background:var(--inputBg);border:1px solid var(--bd2);
    color:var(--accent2);font-variant-numeric:tabular-nums;touch-action:manipulation}
  .numMini:focus{border-color:var(--accent);outline:none}

  .numWrap{display:flex;align-items:center;gap:6px}
  input[type=number]{flex:1;width:100%;background:var(--inputBg);border:1px solid var(--bd2);
    border-radius:7px;padding:7px 9px;color:var(--txt);font-size:13px;outline:none;
    touch-action:manipulation}
  input[type=number]:focus{border-color:var(--accent)}
  .unit{font-size:12px;color:var(--txt4);min-width:34px}

  .delBtn{width:100%;padding:10px;margin-top:8px;border-radius:9px;cursor:pointer;
    background:rgba(239,68,68,.14);border:1px solid rgba(239,68,68,.42);color:#ef4444;
    font-size:13px;transition:.15s;touch-action:manipulation}
  .delBtn:hover{background:rgba(239,68,68,.26);color:#fff}

  /* ===================== 右下：组件列表 ===================== */
  #listPanel{right:12px;bottom:12px;width:250px}
  #listPanel .panelBody{padding:6px 6px 7px;max-height:190px;gap:0}
  .compItem{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;
    font-size:12.5px;cursor:pointer;color:var(--txt2);touch-action:manipulation;
    transition:background .14s var(--ease),color .14s}
  .compItem:hover{background:var(--ctlSoft)}
  .compItem.on{background:rgba(37,99,235,.3);color:var(--txt)}
  body.light .compItem.on{background:rgba(37,99,235,.14);color:#1e293b}
  .compItem .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;
    box-shadow:0 0 5px currentColor}
  .compItem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .compItem .x{color:var(--txt4);font-size:14px;padding:0 4px;border-radius:4px;line-height:1}
  .compItem .x:hover{color:#ef4444;background:rgba(239,68,68,.15)}
  .emptyTip{font-size:12px;color:var(--dim);text-align:center;padding:14px 0}

  /* ===================== 左下：视图 ===================== */
  #viewPanel{left:12px;bottom:12px;width:200px}
  .zoomRow{display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:var(--txt3);margin:2px 0 7px}
  .zoomRow b{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
  #viewPanel .segBtn{padding:5px 0;font-size:12px}
  .viewHint{font-size:10.5px;color:var(--dim);margin-top:6px;line-height:1.55}
  canvas.grabbing{cursor:grabbing}

  .snapRow{display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:var(--txt3);margin:11px 0 7px;
    padding-top:9px;border-top:1px solid var(--bd3)}
  .snapSwitch{border:1px solid var(--bd2);background:var(--ctl);
    color:var(--txt4);font-size:11.5px;padding:3px 13px;border-radius:6px;cursor:pointer;
    transition:.16s;font-variant-numeric:tabular-nums;touch-action:manipulation}
  .snapSwitch:hover{border-color:var(--bd2);color:var(--txt3)}
  .snapSwitch.on{background:rgba(56,189,248,.16);border-color:rgba(56,189,248,.55);
    color:var(--accent2);box-shadow:0 0 10px rgba(56,189,248,.18)}
  #snapSeg{opacity:.4;transition:opacity .16s}
  #snapSeg.on{opacity:1}
  #snapSeg .segBtn{padding:4px 0;font-size:11px;font-variant-numeric:tabular-nums}
  #snapSeg .segBtn.on{background:rgba(56,189,248,.22);color:var(--accent2);
    box-shadow:inset 0 0 0 1px rgba(56,189,248,.35)}

  /* ===================== 顶部工具 ===================== */
  #topTools{position:fixed;right:12px;top:12px;display:flex;gap:7px;z-index:12}
  .iconBtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--bd);
    background:var(--panel);backdrop-filter:blur(14px);color:var(--txt2);
    font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow);line-height:1;touch-action:manipulation;
    transition:color .16s,border-color .16s,transform .16s var(--ease),background .16s}
  .iconBtn:hover{color:var(--txt);border-color:var(--bd2);transform:translateY(-1px)}
  .iconBtn:active{transform:translateY(0) scale(.95)}

  /* ===================== 拖拽读数 HUD ===================== */
  #dragHud{position:fixed;left:0;top:0;z-index:30;pointer-events:none;
    padding:5px 9px;border-radius:7px;font-size:11.5px;line-height:1.4;
    font-variant-numeric:tabular-nums;white-space:nowrap;
    background:var(--hudBg);border:1px solid var(--hudBd);
    color:var(--txt2);box-shadow:0 4px 16px rgba(0,0,0,.28);
    opacity:0;transition:opacity .1s;transform:translate(-999px,-999px)}
  #dragHud b{color:var(--accent);font-weight:600}
  #dragHud .tag{display:inline-block;margin-left:6px;padding:0 5px;border-radius:4px;
    background:rgba(56,189,248,.18);color:var(--accent2);font-size:10px}

  /* ===================== 属性面板分组 ===================== */
  .sectionTitle{font-size:11px;color:var(--txt4);letter-spacing:.5px;margin:14px 0 8px;
    padding-bottom:5px;border-bottom:1px solid var(--bd3);
    text-transform:uppercase;font-weight:600}
  .sectionTitle:first-of-type{margin-top:4px}
  .posGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .posCell{display:flex;align-items:center;gap:5px;background:var(--ctlSoft);
    border:1px solid var(--bd3);border-radius:7px;padding:5px 8px}
  .posCell span{font-size:11px;color:var(--txt4);flex-shrink:0}
  .posCell input{border:none;background:transparent;padding:0;min-width:0;flex:1;
    font-size:12.5px;color:var(--txt);font-variant-numeric:tabular-nums}
  .posCell input:focus{outline:none}
  .posCell .u{font-size:10px;color:var(--dim)}

  /* ===================== 多选面板 ===================== */
  .multiCount{font-size:20px;font-weight:700;color:var(--accent);line-height:1.1}
  .multiRow{display:flex;gap:6px;margin-bottom:8px}
  .multiRow .mBtn{flex:1;padding:7px 0;font-size:11.5px;border-radius:7px;cursor:pointer;
    background:var(--ctl);border:1px solid var(--bd);color:var(--txt2);transition:.14s;
    touch-action:manipulation}
  .multiRow .mBtn:hover{background:var(--ctlHover);color:var(--txt);border-color:var(--bd2)}
  .multiList{max-height:132px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;
    margin:6px 0 2px}

  /* ===================== 悬浮开始按钮 ===================== */
  #playWrap{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);z-index:11;
    display:flex;flex-direction:column;align-items:center;gap:4px;
    touch-action:none;user-select:none;-webkit-touch-callout:none}
  #playBtn{width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;
    background:var(--blue);display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 22px rgba(37,99,235,.42);position:relative;
    transition:background .1s,transform .1s,box-shadow .18s;-webkit-touch-callout:none}
  #playBtn:hover{box-shadow:0 10px 26px rgba(37,99,235,.55)}
  #playBtn:active{transform:scale(.94)}
  #playBtn .icon{width:0;height:0;border-left:15px solid #fff;
    border-top:9px solid transparent;border-bottom:9px solid transparent;
    margin-left:4px;transition:.12s}
  #playBtn.running .icon{width:4px;height:18px;border:none;margin-left:0;
    border-left:5px solid #fff;border-right:5px solid #fff;box-sizing:content-box}
  #chargeRing{position:absolute;left:50%;top:-5px;width:64px;height:64px;margin-left:-32px;
    border-radius:50%;pointer-events:none;opacity:0;transition:opacity .12s;
    background:conic-gradient(#ef4444 calc(var(--cp,0) * 1%), transparent 0);
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px));
    mask:radial-gradient(farthest-side,transparent calc(100% - 5px),#000 calc(100% - 4px))}
  #playWrap.charging #chargeRing{opacity:1}
  #playHint{font-size:10.5px;color:var(--txt4);opacity:.45;letter-spacing:.4px;
    pointer-events:none;transition:opacity .18s}
  #playWrap:hover #playHint{opacity:1}
  #playWrap.charging #playHint{color:#ef4444;opacity:1}

  /* ===================== 底部速率条 ===================== */
  #speedBar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:10;
    display:flex;align-items:center;gap:11px;padding:8px 16px;
    width:min(320px,72vw);background:var(--panel);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);border:1px solid var(--bd);border-radius:26px;
    box-shadow:var(--shadow);transition:border-color .18s,background .18s}
  #speedBar .sliderVal{min-width:46px;text-align:right;font-size:11.5px}
  #speedRange{-webkit-appearance:none;appearance:none;flex:1;height:6px;border-radius:3px;
    outline:none;cursor:pointer;touch-action:none;
    background:linear-gradient(90deg,var(--fill,#38bdf8) var(--p,20%),
      var(--track) var(--p,20%))}
  #speedRange::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:transparent}
  #speedRange::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;
    border-radius:50%;background:var(--fill,#38bdf8);border:2px solid var(--thumbBd);
    cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.35);transition:background .1s}
  #speedRange::-moz-range-thumb{width:15px;height:15px;border:2px solid var(--thumbBd);
    border-radius:50%;background:var(--fill,#38bdf8);cursor:pointer}
  #speedRange::-moz-range-track{background:var(--track);height:6px;border-radius:3px}

  /* ===================== 触屏优化 ===================== */
  html{-webkit-text-size-adjust:100%}
  @media (pointer:coarse){
    .panelHead{height:40px}
    .chev{width:28px;height:28px;font-size:10px}
    .catBtn{padding:10px 0;font-size:13.5px}
    .legendItem{padding:10px 9px;font-size:13.5px}
    .compItem{padding:10px 9px}
    .segBtn{padding:9px 2px;font-size:12.5px}
    input[type=number],.numMini{font-size:16px}
    .snapSwitch{padding:6px 15px;font-size:12.5px}
    #playBtn{width:58px;height:58px}
    #speedBar{padding:10px 16px}
  }

  /* ===================== 减弱动效偏好 ===================== */
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms!important;animation-delay:0ms!important;
      transition-duration:.01ms!important}
  }

  /* ===================== 矮屏适配：优先保证面板互不压盖 ===================== */
  @media (max-height:700px){
    .viewHint{display:none}
    #leftPanel{max-height:calc(100vh - 208px)}
    #propPanel{max-height:calc(100vh - 250px)}
    #listPanel .panelBody{max-height:118px}
    .sectionTitle{margin:10px 0 6px}
    .row{margin-bottom:8px}
  }

  /* ===================== 顶部提示 ===================== */
  .hint{position:fixed;left:50%;top:12px;transform:translateX(-50%);
    font-size:12.5px;color:var(--txt3);background:var(--panelSoft);
    padding:6px 15px;border-radius:18px;border:1px solid var(--bd3);
    z-index:9;pointer-events:none;transition:opacity .3s;
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);max-width:min(520px,58vw);
    text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div class="hint" id="hint">类别 → 组件 → 画布放置 · Shift 点击可多选</div>

<div id="topTools">
