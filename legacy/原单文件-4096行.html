<script>
"use strict";

/* =========================================================
   常量
   ========================================================= */
let SCALE = 100;                          // 每米像素数（可缩放）
const SCALE_MIN = 25, SCALE_MAX = 420;
const MAX_PARTICLES = 1500;
const MAX_TRAIL = 420;
const SUB_DT = 0.0008;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const lerp = (a, b, t) => a + (b - a) * t;

/* =========================================================
   主题（亮色 / 暗色）
   ========================================================= */
const theme = { light: false };

/* 画布用色：随主题切换 */
const CANVAS_DARK = {
  grid:      'rgba(56,189,248,0.075)',
  gridMajor: 'rgba(148,163,184,0.10)',
  gridPlain: 'rgba(148,163,184,0.055)',
  axis:      'rgba(56,189,248,0.16)',
  guide:     'rgba(56,189,248,0.55)',
  guideSoft: 'rgba(56,189,248,0.22)',
  labelBg:   'rgba(11,17,32,0.6)',
  handleBd:  'rgba(255,255,255,0.92)',
  obstacle:  'rgba(226,232,240,0.92)',
  obstacle2: 'rgba(148,163,184,0.45)',
  marquee:   'rgba(56,189,248,0.75)',
  marqueeBg: 'rgba(56,189,248,0.10)',
  selBox:    'rgba(56,189,248,0.75)',
  nameText:  '#0b1120',
  shadow:    'rgba(0,0,0,0.55)',
};
const CANVAS_LIGHT = {
  grid:      'rgba(37,99,235,0.10)',
  gridMajor: 'rgba(51,65,85,0.14)',
  gridPlain: 'rgba(100,116,139,0.10)',
  axis:      'rgba(37,99,235,0.20)',
  guide:     'rgba(2,132,199,0.65)',
  guideSoft: 'rgba(2,132,199,0.22)',
  labelBg:   'rgba(255,255,255,0.82)',
  handleBd:  'rgba(15,23,42,0.78)',
  obstacle:  'rgba(51,65,85,0.9)',
  obstacle2: 'rgba(100,116,139,0.55)',
  marquee:   'rgba(2,132,199,0.85)',
  marqueeBg: 'rgba(2,132,199,0.10)',
  selBox:    'rgba(2,132,199,0.85)',
  nameText:  '#0b1120',
  shadow:    'rgba(15,23,42,0.25)',
};
function CV(){ return theme.light ? CANVAS_LIGHT : CANVAS_DARK; }

/* #rrggbb 明度缩放：亮色主题下把亮色压深，保证白底可读 */
function shade(hex, f){
  if (!hex || hex[0] !== '#' || hex.length < 7) return hex;
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(Math.round(((n >> 16) & 255) * f), 0, 255);
  const g = clamp(Math.round(((n >> 8) & 255) * f), 0, 255);
  const b = clamp(Math.round((n & 255) * f), 0, 255);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
}
/* 主题化颜色：亮色主题自动压深 */
function tc(hex){ return theme.light ? shade(hex, 0.72) : hex; }
/* 两色线性插值（用于速率条由蓝转红） */
function mixHex(h1, h2, t){
  const p = h => { const n = parseInt(h.slice(1),16); return [(n>>16)&255, (n>>8)&255, n&255]; };
  const a = p(h1), b = p(h2);
  const c = a.map((v,i) => Math.round(lerp(v, b[i], t)));
  return '#' + ((1<<24) + (c[0]<<16) + (c[1]<<8) + c[2]).toString(16).slice(1);
}

/* 速度条配色：沿色相环 蓝 → 青 → 绿 → 黄 → 红
   （直接在两色之间插值，中段会发灰发紫，不好看）
   指数 1.4 让低中速长时间保持蓝色调，只有接近满速才明显转红 */
function rampColor(p){
  const t = clamp(p, 0, 1);
  const h = lerp(200, 0, Math.pow(t, 1.4));
  const s = lerp(84, 88, t);
  const l = lerp(57, 54, t);
  return 'hsl(' + h.toFixed(1) + ',' + s.toFixed(0) + '%,' + l.toFixed(0) + '%)';
}

/* 视图平移：画布中心对应的世界坐标 */
const view = { cx: 0, cy: 0 };

/* =========================================================
   网格吸附系统
   ========================================================= */
const snap = {
  on: true,         // 是否开启吸附
  step: 0.5,        // 吸附网格步长（米）
  axisTan: 0.035,   // 端点轴向吸附：约 2°
  rotDeg: 5,        // 旋转吸附步长（度）
};

/* 当前帧的吸附参考线（供渲染层画辅助线） */
let guides = [];
/* 当前帧的场边界吸附结果 {x,y,nx,ny,comp} */
let boundarySnap = null;
/* 框选矩形（屏幕坐标） */
let marqueeRect = null;

/* 拖拽读数 HUD */
const hudEl = document.getElementById('dragHud');

function roundTo(v, s){ return Math.round(v / s) * s; }

/* 方向性吸附：按「相对起始值的变化方向」取整
   - 变小 → 向下截断：15.40 变 15.00（多余的小数部分直接减掉）
   - 变大 → 向上补足：15.40 变 15.50（不够的部分补齐，不会越过还没到的格线）
   base 为按下拖动那一刻的值；缺省时退化为四舍五入。 */
function snapTo(v, step, base){
  if (base === undefined || base === null || !isFinite(base)) return roundTo(v, step);
  const EPS = 1e-9;
  // 起手抖动死区：几乎没动时保持原值，避免在两条格线间反复跳
  if (Math.abs(v - base) < step * 0.06) return base;
  const q = v / step;
  if (v > base + EPS) return Math.ceil(q - EPS) * step;
  if (v < base - EPS) return Math.floor(q + EPS) * step;
  return roundTo(base, step);
}

/* 角度吸附：归一到 [0, 2π)，近轴自动贴合 0/90/180/270 */
function snapAngle(rad, snapDeg){
  const twoPi = Math.PI * 2;
  let a = rad % twoPi;
  if (a < 0) a += twoPi;
  if (snapDeg){
    const st = snapDeg * Math.PI / 180;
    a = roundTo(a, st);
  }
  // 近轴贴合（≈1.6°）
  const axes = [0, Math.PI/2, Math.PI, Math.PI*1.5, twoPi];
  for (const ax of axes){
    if (Math.abs(a - ax) < 0.028) return ax % twoPi;
  }
  return a % twoPi;
}

/* 端点吸附：网格 + 轴向对齐（相对固定端点）
   base = 该端点在按下时的位置，用于方向性截断 */
function snapEndpoint(fixed, moving, act, base){
  let mx = moving[0], my = moving[1];
  if (!act) return [mx, my];
  mx = snapTo(mx, snap.step, base ? base[0] : undefined);
  my = snapTo(my, snap.step, base ? base[1] : undefined);
  const dx = mx - fixed[0], dy = my - fixed[1];
  if (Math.abs(dy) < Math.abs(dx) * snap.axisTan) my = fixed[1];      // 水平
  else if (Math.abs(dx) < Math.abs(dy) * snap.axisTan) mx = fixed[0]; // 竖直
  return [mx, my];
}

/* 拖动后的位置：优先吸附场边界（发射器），其次网格
   baseX/baseY = 按下时的位置（方向性截断用） */
function resolvePos(rawX, rawY, act, comp, baseX, baseY){
  guides = [];
  boundarySnap = null;
  if (!act) return [rawX, rawY];

  // 发射器贴近场边界时直接贴到边界上
  if (comp && comp.kind === 'emitter'){
    const hit = nearestFieldBoundary(rawX, rawY, 14 / SCALE, comp.id);
    if (hit){
      boundarySnap = hit;
      return [hit.x, hit.y];
    }
  }

  const x = snapTo(rawX, snap.step, baseX);
  const y = snapTo(rawY, snap.step, baseY);
  guides.push({ axis:'x', v:x, grid:true }, { axis:'y', v:y, grid:true });
  return [x, y];
}

/* HUD 显示（贴边时自动翻到光标另一侧） */
function showHud(clientX, clientY, html){
  hudEl.innerHTML = html;
  const bw = hudEl.offsetWidth || 150;
  const bh = hudEl.offsetHeight || 42;
  let x = clientX + 16, y = clientY + 18;
  if (x + bw > window.innerWidth - 8) x = clientX - bw - 14;
  if (y + bh > window.innerHeight - 8) y = clientY - bh - 14;
  hudEl.style.transform = `translate(${Math.round(x)}px, ${Math.round(y)}px)`;
  hudEl.style.opacity = '1';
}
function hideHud(){ hudEl.style.opacity = '0'; }

const fmt2 = v => (Math.abs(v) < 5e-4 ? 0 : v).toFixed(2);
const snapTag = act => act ? '<span class="tag">吸附 ' + snap.step + 'm</span>' : '';

/* =========================================================
   画布
   ========================================================= */
const canvas = document.getElementById('cv');
let ctx = canvas.getContext('2d');
/* 场渲染离屏层：负场在这一层上"挖洞"，从而只淡化场本身、不伤网格与粒子 */
let fieldLayer = null, fieldCtx = null;
let W = 0, H = 0;

function resize(){
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  if (!fieldLayer){
    fieldLayer = document.createElement('canvas');
    fieldCtx = fieldLayer.getContext('2d');
  }
  fieldLayer.width  = canvas.width;
  fieldLayer.height = canvas.height;
  fieldCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

function w2s(x, y){ return [W/2 + (x - view.cx)*SCALE, H/2 - (y - view.cy)*SCALE]; }
function s2w(sx, sy){ return [(sx - W/2)/SCALE + view.cx, (H/2 - sy)/SCALE + view.cy]; }

/* =========================================================
   形状定义
   ========================================================= */
const SHAPES = {
  single:       { name:'单边界',        w:0,  h:0,  noBoundary:true,  infinite:true,  open:true },
  double:       { name:'双边界',        w:2,  h:0,  noBoundary:true,  infinite:true,  open:true },
  singleFinite: { name:'单边界有限场',  w:0,  h:3,  noBoundary:false, infinite:true,  open:true },
  doubleFinite: { name:'双边界有限场',  w:2,  h:3,  noBoundary:false, infinite:false },
  sector:       { name:'扇形场',        w:0,  h:0,  r:2.5, span:90, noBoundary:false, infinite:false },
  triangle:     { name:'三角形场',      w:3,  h:2.5,noBoundary:false, infinite:false },
  rect:         { name:'矩形场',        w:3,  h:2,  noBoundary:false, infinite:false },
  circle:       { name:'圆形场',        w:0,  h:0,  r:1.6, noBoundary:false, infinite:false },
  ellipse:      { name:'椭圆形场',      w:3.2,h:2,  noBoundary:false, infinite:false },
  infinite:     { name:'无限场',        w:0,  h:0,  noBoundary:true,  infinite:true  },
};
const OPEN_SHAPES = new Set(['single','double','singleFinite']);

function toLocal(f, px, py){
  const dx = px - f.x, dy = py - f.y;
  const ca = Math.cos(-f.angle), sa = Math.sin(-f.angle);
  return [ dx*ca - dy*sa, dx*sa + dy*ca ];
}
function toWorld(f, lx, ly){
  const ca = Math.cos(f.angle), sa = Math.sin(f.angle);
  return [ f.x + lx*ca - ly*sa, f.y + lx*sa + ly*ca ];
}

/* ---------- 三角形：以三个顶点为准（局部坐标） ----------
   默认等腰三角形：底边在 y=-h/2，顶点在 y=+h/2。
   顶点可自由拖动，拖动结束后把重心归零并换算回中心位置。 */
function triVerts(c){
  if (!c.tv || c.tv.length !== 3){
    const hw = (c.w || 3) / 2, hh = (c.h || 2.5) / 2;
    c.tv = [[-hw, -hh], [hw, -hh], [0, hh]];
  }
  return c.tv;
}
function updateTriBox(c){
  const v = triVerts(c);
  let mnx = Infinity, mxx = -Infinity, mny = Infinity, mxy = -Infinity;
  for (const p of v){
    mnx = Math.min(mnx, p[0]); mxx = Math.max(mxx, p[0]);
    mny = Math.min(mny, p[1]); mxy = Math.max(mxy, p[1]);
  }
  c.w = Math.max(0.3, mxx - mnx);
  c.h = Math.max(0.3, mxy - mny);
}
/* 由宽高重建标准等腰三角形（面板滑杆用） */
function setTriSize(c, w, h){
  const hw = Math.max(0.15, w/2), hh = Math.max(0.15, h/2);
  c.w = w; c.h = h;
  c.tv = [[-hw, -hh], [hw, -hh], [0, hh]];
}
/* 拖动结束后：重心移到组件中心，顶点坐标随之归一 */
function recenterTriangle(c){
  const v = triVerts(c);
  const cx = (v[0][0] + v[1][0] + v[2][0]) / 3;
  const cy = (v[0][1] + v[1][1] + v[2][1]) / 3;
  for (const p of v){ p[0] -= cx; p[1] -= cy; }
  const ca = Math.cos(c.angle), sa = Math.sin(c.angle);
  c.x += cx*ca - cy*sa;
  c.y += cx*sa + cy*ca;
  updateTriBox(c);
}
function pointInTri(px, py, v){
  const d1 = (px - v[1][0]) * (v[0][1] - v[1][1]) - (v[0][0] - v[1][0]) * (py - v[1][1]);
  const d2 = (px - v[2][0]) * (v[1][1] - v[2][1]) - (v[1][0] - v[2][0]) * (py - v[2][1]);
  const d3 = (px - v[0][0]) * (v[2][1] - v[0][1]) - (v[2][0] - v[0][0]) * (py - v[0][1]);
  const neg = (d1 < 0) || (d2 < 0) || (d3 < 0);
  const pos = (d1 > 0) || (d2 > 0) || (d3 > 0);
  return !(neg && pos);
}

function insideShape(f, px, py){
  const [lx, ly] = toLocal(f, px, py);
  switch(f.shape){
    case 'infinite': return true;
    case 'rect': case 'doubleFinite':
      return Math.abs(lx) <= f.w/2 && Math.abs(ly) <= f.h/2;
    case 'circle':
      return lx*lx + ly*ly <= f.r*f.r;
    case 'ellipse':
      return (lx/(f.w/2))**2 + (ly/(f.h/2))**2 <= 1;
    case 'sector': {
      const r = Math.hypot(lx, ly);
      if (r > f.r) return false;
      if (r < 1e-9) return true;
      const a = Math.atan2(ly, lx);
      return Math.abs(a) <= f.span*Math.PI/360;
    }
    case 'triangle':
      return pointInTri(lx, ly, triVerts(f));
    case 'single':       return lx >= 0;
    case 'double':       return Math.abs(lx) <= f.w/2;
    case 'singleFinite': return lx >= 0 && Math.abs(ly) <= f.h/2;
  }
  return false;
}

/* =========================================================
   边界几何：任意形状的边界最近点 + 外法线
   ========================================================= */
function normAngle(a){
  const twoPi = Math.PI * 2;
  a %= twoPi;
  if (a < 0) a += twoPi;
  return a;
}

/* 形状边界上距 (px,py) 最近的点；返回 {x,y,nx,ny,dist}（法线指向形状外侧） */
function nearestOnBoundary(c, px, py){
  const [lx, ly] = toLocal(c, px, py);
  const ca = Math.cos(c.angle), sa = Math.sin(c.angle);
  let best = null;

  // 局部点 → 世界点 + 世界法线
  const push = (qlx, qly, nlx, nly) => {
    const wx = c.x + qlx*ca - qly*sa;
    const wy = c.y + qlx*sa + qly*ca;
    let nx = nlx*ca - nly*sa;
    let ny = nlx*sa + nly*ca;
    const nl = Math.hypot(nx, ny) || 1;
    nx /= nl; ny /= nl;
    const d = Math.hypot(wx - px, wy - py);
    if (!best || d < best.dist) best = { x: wx, y: wy, nx, ny, dist: d };
  };

  // 线段最近点（局部坐标），法线取远离中心的一侧
  const seg = (ax, ay, bx, by) => {
    const vx = bx - ax, vy = by - ay;
    const L2 = vx*vx + vy*vy;
    let t = L2 < 1e-12 ? 0 : ((lx - ax)*vx + (ly - ay)*vy) / L2;
    t = Math.max(0, Math.min(1, t));
    const qx = ax + vx*t, qy = ay + vy*t;
    let nx = -vy, ny = vx;
    const nl = Math.hypot(nx, ny) || 1;
    nx /= nl; ny /= nl;
    // 朝外：与「点相对中心」同向
    if (nx*qx + ny*qy < 0){ nx = -nx; ny = -ny; }
    push(qx, qy, nx, ny);
  };

  switch (c.shape){
    case 'infinite': return null;

    case 'rect': case 'doubleFinite': {
      const hw = c.w/2, hh = c.h/2;
      seg(-hw, -hh,  hw, -hh);
      seg( hw, -hh,  hw,  hh);
      seg( hw,  hh, -hw,  hh);
      seg(-hw,  hh, -hw, -hh);
      return best;
    }

    case 'circle': {
      const r0 = Math.hypot(lx, ly);
      if (r0 < 1e-9){ push(c.r, 0, 1, 0); return best; }
      const ux = lx / r0, uy = ly / r0;
      push(ux*c.r, uy*c.r, ux, uy);
      return best;
    }

    case 'ellipse': {
      const a = c.w/2, b = c.h/2;
      const r0 = Math.hypot(lx, ly);
      if (r0 < 1e-9){ push(a, 0, 1, 0); return best; }
      const ux = lx/r0, uy = ly/r0;
      const t = 1 / Math.sqrt((ux/a)**2 + (uy/b)**2);
      const qx = ux*t, qy = uy*t;
      push(qx, qy, qx/(a*a), qy/(b*b));
      return best;
    }

    case 'sector': {
      const half = c.span * Math.PI / 360;
      const ang = Math.atan2(ly, lx);
      const r0 = Math.hypot(lx, ly);
      if (Math.abs(ang) <= half && r0 > 1e-9){
        const ux = lx/r0, uy = ly/r0;
        push(ux*c.r, uy*c.r, ux, uy);       // 圆弧段
      } else {
        seg(0, 0, Math.cos(half)*c.r,  Math.sin(half)*c.r);
        seg(0, 0, Math.cos(-half)*c.r, Math.sin(-half)*c.r);
      }
      return best;
    }

    case 'triangle': {
      const v = triVerts(c);
      seg(v[0][0], v[0][1], v[1][0], v[1][1]);
      seg(v[1][0], v[1][1], v[2][0], v[2][1]);
      seg(v[2][0], v[2][1], v[0][0], v[0][1]);
      return best;
    }

    case 'double': {
      const hw = c.w/2;
      seg(-hw, -2000, -hw, 2000);
      seg( hw, -2000,  hw, 2000);
      return best;
    }

    case 'single': {
      seg(0, -2000, 0, 2000);
      return best;
    }

    case 'singleFinite': {
      const hh = c.h/2;
      seg(0, -hh, 0, hh);
      return best;
    }
  }
  return null;
}

/* 在所有场（含负场）边界中找最近的一个 */
function nearestFieldBoundary(px, py, maxDist, excludeId){
  let best = null;
  for (const c of state.components){
    if (c.kind !== 'field' && c.kind !== 'negfield') continue;
    if (c.id === excludeId) continue;
    if (c.shape === 'infinite') continue;
    const hit = nearestOnBoundary(c, px, py);
    if (!hit) continue;
    if (hit.dist > maxDist) continue;
    if (!best || hit.dist < best.dist) best = { ...hit, comp: c };
  }
  return best;
}

/* 指向场内部的方向（用于粒子射入） */
function inwardDir(hit){
  const c = hit.comp;
  let nx = -hit.nx, ny = -hit.ny;                 // 先试反法线
  const eps = 0.02;
  if (insideShape(c, hit.x + nx*eps, hit.y + ny*eps)) return [nx, ny];
  return [-nx, -ny];
}

/* =========================================================
   全局状态
   ========================================================= */
const state = {
  components: [],
  selection: [],          // 多选：按选中顺序保存 id，最后一个是"主选中"
  pending: null,
  running: false,
  speed: 0.2,
  simTime: 0,
  counters: {},
  nextId: 1,

  /* 兼容旧逻辑：selectedId 读写都映射到 selection */
  get selectedId(){
    return this.selection.length ? this.selection[this.selection.length - 1] : null;
  },
  set selectedId(v){
    this.selection = (v === null || v === undefined) ? [] : [v];
  },
};

/* ---------- 选择辅助 ---------- */
function isSelected(id){ return state.selection.indexOf(id) >= 0; }
function selList(){
  const out = [];
  for (const id of state.selection){
    const c = state.components.find(x => x.id === id);
    if (c) out.push(c);
  }
  return out;
}
function primaryComp(){
  const id = state.selectedId;
  return (id === null || id === undefined) ? null : (state.components.find(c => c.id === id) || null);
}
function setSelection(ids){
  state.selection = ids.filter((id, i) => ids.indexOf(id) === i);
  buildPropPanel();
  renderCompList();
}
function toggleSelect(id){
  const i = state.selection.indexOf(id);
  if (i >= 0) state.selection.splice(i, 1);
  else state.selection.push(id);
  buildPropPanel();
  renderCompList();
}

let particles = [];

const PALETTE_DARK  = ['#22d3ee','#f472b6','#a3e635','#fbbf24','#a78bfa',
                       '#fb7185','#34d399','#60a5fa','#f97316','#e879f9'];
const PALETTE_LIGHT = ['#0891b2','#db2777','#4d7c0f','#b45309','#7c3aed',
                       '#e11d48','#059669','#2563eb','#ea580c','#a21caf'];
function palColor(i){
  const arr = theme.light ? PALETTE_LIGHT : PALETTE_DARK;
  return arr[i % arr.length];
}
let emitterColorIdx = 0;

const E_PRESET = { weak:0.05, mid:0.2, strong:1.0 };
const B_PRESET = { weak:0.01, mid:0.05, strong:0.2 };
const E_MIN = 0.01, E_MAX = 5;
const B_MIN = 0.002, B_MAX = 1;

/* =========================================================
   组件创建
   ========================================================= */
function nextName(base){
  state.counters[base] = (state.counters[base] || 0) + 1;
  return base + state.counters[base];
}

function makeField(shapeKey, wx, wy, negative){
  const def = SHAPES[shapeKey];
  const id = state.nextId++;
  const name = nextName(def.name);
  const c = {
    id, kind: negative ? 'negfield' : 'field',
    name, negative: !!negative,
    shape: shapeKey, x: wx, y: wy, angle: 0,
    w: def.w || 2, h: def.h || 2, r: def.r || 1.6, span: def.span || 90,
    fieldType: 'E',
    strength: negative ? 0 : E_PRESET.mid,
    fieldAngle: 0,
    bDir: 1,
    boundary: def.noBoundary ? 'virtual' : 'solid',
  };
  if (shapeKey === 'triangle') setTriSize(c, c.w, c.h);
  return c;
}

function makeObstacle(wx, wy){
  const id = state.nextId++;
  return {
    id, kind:'obstacle', name: nextName('线形障碍'),
    x: wx, y: wy, angle: 0, len: 3,
  };
}

function makeEmitter(wx, wy){
  const id = state.nextId++;
  const cidx = emitterColorIdx++;
  const color = palColor(cidx);
  return {
    id, kind:'emitter', name: nextName('发射器'),
    cidx,
    x: wx, y: wy,
    mode: 'single',
    chargeSign: 1,
    charge: 1e-6,
    mass: 1e-8,
    v0: 10,
    vAngle: 0,
    continuous: true,
    interval: 0.15,
    trailMode: 'solid',
    angleDensity: 'mid',
    speedDensity: 'mid',
    lineDensity: 'mid',
    lineLength: 2,
    lineAngle: 90,
    spread: 60,
    color,
    acc: 0,
    emittedOnce: false,
  };
}

function placeComponent(cat, shapeKey, wx, wy){
  let c = null;
  if (cat === 'field')    c = makeField(shapeKey, wx, wy, false);
  if (cat === 'negative') c = makeField(shapeKey, wx, wy, true);
  if (cat === 'obstacle') c = makeObstacle(wx, wy);
  if (cat === 'emitter')  c = makeEmitter(wx, wy);
  if (!c) return null;

  // 发射器形式由所选图例决定
  if (cat === 'emitter') c.mode = shapeKey;

  if (c.kind === 'field'){
    c.strength = E_PRESET.mid;
    c.boundary = SHAPES[c.shape].noBoundary ? 'virtual' : 'solid';
  }
  state.components.push(c);
  selectComponent(c.id);
  return c;
}

function selectComponent(id){
  state.selectedId = id;
  buildPropPanel();
  renderCompList();
}

/* =========================================================
   物理采样
   ========================================================= */
function sampleField(px, py){
  let Ex = 0, Ey = 0, Bz = 0;
  for (let i = 0; i < state.components.length; i++){
    const c = state.components[i];
    if (c.kind === 'negfield' && insideShape(c, px, py)) return { Ex:0, Ey:0, Bz:0 };
  }
  for (let i = 0; i < state.components.length; i++){
    const c = state.components[i];
    if (c.kind !== 'field') continue;
    if (!insideShape(c, px, py)) continue;
    if (c.fieldType === 'E'){
      Ex += c.strength * Math.cos(c.fieldAngle);
      Ey += c.strength * Math.sin(c.fieldAngle);
    } else {
      Bz += c.strength * c.bDir;
    }
  }
  return { Ex, Ey, Bz };
}

/* =========================================================
   粒子
   ========================================================= */
function densityCount(d){
  return d === 'low' ? 3 : d === 'high' ? 9 : 5;
}

function spawnParticle(em, x, y, v, angleRad){
  if (particles.length >= MAX_PARTICLES) return;
  particles.push({
    x, y,
    vx: v * Math.cos(angleRad),
    vy: v * Math.sin(angleRad),
    q: em.chargeSign * em.charge,
    m: em.mass,
    color: em.color,
    emitterId: em.id,
    trailMode: em.trailMode,
    trail: [[x, y]],
    stopped: false,
  });
}

function emitFrom(em){
  const q = em.chargeSign * em.charge;
  if (q === 0 || em.mass <= 0) return;

  if (em.mode === 'single'){
    spawnParticle(em, em.x, em.y, em.v0, em.vAngle * Math.PI/180);
  }
  else if (em.mode === 'angles'){
    const n = densityCount(em.angleDensity);
    const spread = em.spread * Math.PI/180;
    for (let i = 0; i < n; i++){
      const a = em.vAngle*Math.PI/180 - spread/2 + spread * (n === 1 ? 0.5 : i/(n-1));
      spawnParticle(em, em.x, em.y, em.v0, a);
    }
  }
  else if (em.mode === 'speeds'){
    const n = densityCount(em.speedDensity);
    for (let i = 0; i < n; i++){
      const v = em.v0 * (0.4 + 1.2 * (n === 1 ? 0.5 : i/(n-1)));
      spawnParticle(em, em.x, em.y, v, em.vAngle*Math.PI/180);
    }
  }
  else if (em.mode === 'line'){
    const n = densityCount(em.lineDensity);
    const dx = Math.cos(em.lineAngle*Math.PI/180);
    const dy = Math.sin(em.lineAngle*Math.PI/180);
    for (let i = 0; i < n; i++){
      const t = (n === 1) ? 0.5 : i/(n-1);
      const px = em.x + (t - 0.5) * em.lineLength * dx;
      const py = em.y + (t - 0.5) * em.lineLength * dy;
      spawnParticle(em, px, py, em.v0, em.vAngle*Math.PI/180);
    }
  }
}

/* =========================================================
   物理推进
   ========================================================= */
function stepParticles(h){
  for (let i = 0; i < particles.length; i++){
    const p = particles[i];
    if (p.stopped) continue;

    const ox = p.x, oy = p.y;
    const { Ex, Ey, Bz } = sampleField(p.x, p.y);
    const qm = p.q / p.m;

    let vxm = p.vx + qm * Ex * h * 0.5;
    let vym = p.vy + qm * Ey * h * 0.5;

    if (Bz !== 0){
      const tz = qm * Bz * h * 0.5;
      const vpx = vxm + vym * tz;
      const vpy = vym - vxm * tz;
      const s = 2 / (1 + tz*tz);
      const vxp = vxm + s * vpy * tz;
      const vyp = vym - s * vpx * tz;
      vxm = vxp; vym = vyp;
    }

    p.vx = vxm + qm * Ex * h * 0.5;
    p.vy = vym + qm * Ey * h * 0.5;
    p.x += p.vx * h;
    p.y += p.vy * h;

    if (checkCollision(p, ox, oy)) continue;

    const t = p.trail;
    const last = t[t.length - 1];
    if ((p.x-last[0])*(p.x-last[0]) + (p.y-last[1])*(p.y-last[1]) > 0.0009){
      t.push([p.x, p.y]);
      if (t.length > MAX_TRAIL) t.shift();
    }
  }
}

function checkCollision(p, ox, oy){
  for (let i = 0; i < state.components.length; i++){
    const c = state.components[i];
    if (c.kind !== 'field') continue;
    if (c.boundary !== 'solid') continue;
    if (SHAPES[c.shape].noBoundary || c.shape === 'infinite') continue;

    const wasIn = insideShape(c, ox, oy);
    const isIn  = insideShape(c, p.x, p.y);
    if (wasIn === isIn) continue;

    let a = 0, b = 1;
    for (let k = 0; k < 22; k++){
      const m = (a + b) / 2;
      const mx = ox + (p.x - ox)*m, my = oy + (p.y - oy)*m;
      if (insideShape(c, mx, my) === wasIn) a = m; else b = m;
    }
    p.x = ox + (p.x - ox)*a;
    p.y = oy + (p.y - oy)*a;
    p.vx = 0; p.vy = 0; p.stopped = true;
    return true;
  }

  for (let i = 0; i < state.components.length; i++){
    const c = state.components[i];
    if (c.kind !== 'obstacle') continue;
    const dx = Math.cos(c.angle) * c.len / 2;
    const dy = Math.sin(c.angle) * c.len / 2;
    const hit = segIntersect(ox, oy, p.x, p.y,
                             c.x - dx, c.y - dy, c.x + dx, c.y + dy);
    if (hit){
      p.x = hit[0]; p.y = hit[1];
      p.vx = 0; p.vy = 0; p.stopped = true;
      return true;
    }
  }
  return false;
}

function segIntersect(x1,y1,x2,y2,x3,y3,x4,y4){
  const d = (x2-x1)*(y4-y3) - (y2-y1)*(x4-x3);
  if (Math.abs(d) < 1e-12) return null;
  const t = ((x3-x1)*(y4-y3) - (y3-y1)*(x4-x3)) / d;
  const u = ((x3-x1)*(y2-y1) - (y3-y1)*(x2-x1)) / d;
  if (t >= 0 && t <= 1 && u >= 0 && u <= 1)
    return [x1 + t*(x2-x1), y1 + t*(y2-y1)];
  return null;
}

/* =========================================================
   模拟循环
   ========================================================= */
function simulate(dtReal){
  const dtSim = dtReal * state.speed;

  for (let i = 0; i < state.components.length; i++){
    const c = state.components[i];
    if (c.kind !== 'emitter') continue;
    if (!c.continuous){
      if (!c.emittedOnce){ emitFrom(c); c.emittedOnce = true; }
    } else {
      c.acc = (c.acc || 0) + dtSim;
      let guard = 0;
      while (c.acc >= c.interval && guard++ < 12){
        c.acc -= c.interval;
        emitFrom(c);
      }
    }
  }

  let remain = dtSim, guard = 0;
  while (remain > 1e-12 && guard++ < 600){
    const h = Math.min(SUB_DT, remain);
    remain -= h;
    stepParticles(h);
  }
  state.simTime += dtSim;
}

/* =========================================================
   渲染
   ========================================================= */
function render(){
  ctx.clearRect(0, 0, W, H);
  drawGrid();

  const selSet = new Set(state.selection);
  const hasSel = state.selection.length > 0;
  const single = state.selection.length === 1;
  const dim = id => hasSel && !selSet.has(id);

  drawAllFields(dim);

  for (const c of state.components){
    if (c.kind !== 'obstacle') continue;
    ctx.globalAlpha = dim(c.id) ? 0.12 : 1;
    drawObstacle(c);
    ctx.globalAlpha = 1;
  }

  drawParticles();

  for (const c of state.components){
    if (c.kind !== 'emitter') continue;
    ctx.globalAlpha = dim(c.id) ? 0.18 : 1;
    drawEmitter(c);
    ctx.globalAlpha = 1;
  }

  // 多选：每个选中项画虚线外框（单选时用变换手柄表达）
  if (!single) for (const c of selList()) drawSelectionBox(c);

  const sel = single ? primaryComp() : null;
  if (sel) drawHandles(sel);

  // 旋转中的角度指示（参考轴 + 圆弧 + 度数）
  if (sel && drag && drag.type === 'handle' && drag.handleType === 'rot') drawRotIndicator(sel);

  // 场边界吸附高亮
  if (boundarySnap) drawBoundarySnapHint();

  // 待放置组件的吸附预览
  if (state.pending && hover) drawGhost(state.pending, hover.x, hover.y);

  drawGuides();
  drawMarquee();
}

/* 组件世界包围盒（框选 / 选中框用） */
function compAABB(c){
  if (c.kind === 'obstacle'){
    const dx = Math.cos(c.angle)*c.len/2, dy = Math.sin(c.angle)*c.len/2;
    return { x0: Math.min(c.x-dx, c.x+dx), x1: Math.max(c.x-dx, c.x+dx),
             y0: Math.min(c.y-dy, c.y+dy), y1: Math.max(c.y-dy, c.y+dy) };
  }
  if (c.kind === 'emitter'){
    const r = 0.36;
    return { x0: c.x-r, x1: c.x+r, y0: c.y-r, y1: c.y+r };
  }
  if (c.shape === 'infinite'){
    const [ax, ay] = s2w(0, 0), [bx, by] = s2w(W, H);
    return { x0: Math.min(ax,bx), x1: Math.max(ax,bx),
             y0: Math.min(ay,by), y1: Math.max(ay,by) };
  }
  let pts;
  if (OPEN_SHAPES.has(c.shape)){
    const half = shortHalfPx(c) / SCALE;
    if (c.shape === 'double') pts = [[-c.w/2,-half],[c.w/2,-half],[c.w/2,half],[-c.w/2,half]];
    else if (c.shape === 'single') pts = [[0,-half],[0,half]];
    else pts = [[-0.1,-c.h/2],[0.1,-c.h/2],[0.1,c.h/2],[-0.1,c.h/2]];
  } else if (c.shape === 'triangle'){
    pts = triVerts(c).slice();
  } else if (c.shape === 'circle' || c.shape === 'sector'){
    const r = c.r;
    pts = [[-r,-r],[r,-r],[r,r],[-r,r]];
  } else {
    const hw = c.w/2, hh = c.h/2;
    pts = [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]];
  }
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  for (const [lx, ly] of pts){
    const [wx, wy] = toWorld(c, lx, ly);
    x0 = Math.min(x0, wx); x1 = Math.max(x1, wx);
    y0 = Math.min(y0, wy); y1 = Math.max(y1, wy);
  }
  return { x0, x1, y0, y1 };
}

/* 多选项外框 */
function drawSelectionBox(c){
  const b = compAABB(c);
  const [ax, ay] = w2s(b.x0, b.y1);
  const [bx, by] = w2s(b.x1, b.y0);
  const cv = CV();
  ctx.save();
  ctx.setLineDash([5, 4]);
  ctx.strokeStyle = cv.selBox;
  ctx.lineWidth = 1.4;
  ctx.strokeRect(ax - 4, ay - 4, (bx - ax) + 8, (by - ay) + 8);
  ctx.setLineDash([]);
  // 左上角小方块，强调"已选中"
  ctx.fillStyle = cv.selBox;
  ctx.fillRect(ax - 6, ay - 6, 5, 5);
  ctx.restore();
}

/* 框选矩形 */
function drawMarquee(){
  if (!marqueeRect) return;
  const { x0, y0, x1, y1 } = marqueeRect;
  const cv = CV();
  ctx.save();
  ctx.fillStyle = cv.marqueeBg;
  ctx.strokeStyle = cv.marquee;
  ctx.lineWidth = 1.2;
  ctx.setLineDash([5, 4]);
  const x = Math.min(x0, x1), y = Math.min(y0, y1);
  ctx.fillRect(x, y, Math.abs(x1-x0), Math.abs(y1-y0));
  ctx.strokeRect(x, y, Math.abs(x1-x0), Math.abs(y1-y0));
  ctx.setLineDash([]);
  ctx.restore();
}

/* 旋转指示：从 0°（本地 +x 轴）画到当前角度 */
function drawRotIndicator(c){
  const [cx, cy] = w2s(c.x, c.y);
  const R = 54;
  const a = -c.angle;                 // 屏幕角（y 轴向下）

  ctx.save();
  // 0° 参考轴
  ctx.setLineDash([5, 4]);
  ctx.strokeStyle = 'rgba(245,158,11,0.5)';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(cx, cy); ctx.lineTo(cx + R*1.9, cy);
  ctx.stroke();
  ctx.setLineDash([]);

  // 角度圆弧
  ctx.strokeStyle = 'rgba(245,158,11,0.9)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, a, a < 0);
  ctx.stroke();

  // 半径指示线
  ctx.strokeStyle = 'rgba(245,158,11,0.45)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(a)*R, cy + Math.sin(a)*R);
  ctx.stroke();

  // 度数
  const deg = (c.angle * 180 / Math.PI + 360) % 360;
  const mid = a / 2;
  const lx = cx + Math.cos(mid) * (R + 16);
  const ly = cy + Math.sin(mid) * (R + 16);
  ctx.font = '600 12px system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(245,158,11,0.98)';
  ctx.fillText(deg.toFixed(1) + '°', lx, ly);
  ctx.restore();
}

/* 场边界吸附：描亮边界 + 吸附点 + 指向场内的法线 */
function drawBoundarySnapHint(){
  const hit = boundarySnap;
  const c = hit.comp;
  if (!c) return;

  const [sx, sy] = w2s(c.x, c.y);
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(-c.angle);
  ctx.beginPath();
  buildShapePath(c);
  ctx.setLineDash([]);
  const hi = theme.light ? 'rgba(2,132,199,0.95)' : 'rgba(34,211,238,0.95)';
  ctx.strokeStyle = hi;
  ctx.lineWidth = 3;
  ctx.shadowColor = theme.light ? 'rgba(2,132,199,0.35)' : 'rgba(34,211,238,0.7)';
  ctx.shadowBlur = 12;
  ctx.stroke();
  ctx.restore();

  const [px, py] = w2s(hit.x, hit.y);
  ctx.save();
  // 吸附点
  ctx.beginPath();
  ctx.arc(px, py, 6, 0, Math.PI*2);
  ctx.fillStyle = hi;
  ctx.fill();
  ctx.strokeStyle = CV().handleBd;
  ctx.lineWidth = 1.8;
  ctx.stroke();

  // 法线箭头（指向场内）
  const [ix, iy] = inwardDir(hit);
  const [qx, qy] = w2s(hit.x + ix*0.55, hit.y + iy*0.55);
  ctx.strokeStyle = hi;
  ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(qx, qy); ctx.stroke();

  const ang = Math.atan2(qy - py, qx - px);
  ctx.beginPath();
  ctx.moveTo(qx, qy);
  ctx.lineTo(qx - Math.cos(ang - 0.42)*8, qy - Math.sin(ang - 0.42)*8);
  ctx.lineTo(qx - Math.cos(ang + 0.42)*8, qy - Math.sin(ang + 0.42)*8);
  ctx.closePath();
  ctx.fillStyle = hi;
  ctx.fill();
  ctx.restore();
}

/* 待放置组件的半透明预览（含吸附落点十字） */
function pendingLabel(p){
  if (p.cat === 'obstacle') return '线形障碍';
  if (p.cat === 'emitter') return EMITTER_LABEL[p.key] || '发射器';
  return (SHAPES[p.key] && SHAPES[p.key].name) || p.key;
}

function drawGhost(pending, wx, wy){
  const key = pending.key;
  const def = SHAPES[key] || {};
  let g;
  if (pending.cat === 'obstacle'){
    g = { kind:'obstacle', shape:'line', x:wx, y:wy, angle:0, len:3 };
  } else if (pending.cat === 'emitter'){
    g = {
      kind:'emitter', name: pendingLabel(pending), x:wx, y:wy, angle:0,
      vAngle:0, color:'#38bdf8', mode: key,
      lineLength: 2, lineAngle: 90,
    };
  } else {
    g = {
      kind: pending.cat === 'negative' ? 'negfield' : 'field',
      shape: key, name: def.name || '', x: wx, y: wy, angle: 0,
      w: def.w || 2, h: def.h || 2, r: def.r || 1.6, span: def.span || 90,
      fieldType: 'E', strength: E_PRESET.mid, fieldAngle: 0, bDir: 1,
      boundary: (key === 'infinite' || def.noBoundary) ? 'virtual' : 'solid',
    };
  }

  ctx.save();
  ctx.globalAlpha = 0.42;
  if (g.kind === 'obstacle') drawObstacle(g);
  else if (g.kind === 'emitter') drawEmitter(g);
  else drawFieldComponent(g);
  ctx.restore();

  // 落点十字：吸附命中时更亮
  const [sx, sy] = w2s(wx, wy);
  ctx.save();
  ctx.strokeStyle = snap.on
    ? (theme.light ? 'rgba(2,132,199,0.9)' : 'rgba(56,189,248,0.9)')
    : (theme.light ? 'rgba(100,116,139,0.75)' : 'rgba(148,163,184,0.7)');
  ctx.lineWidth = 1.4;
  ctx.beginPath();
  ctx.moveTo(sx - 9, sy); ctx.lineTo(sx + 9, sy);
  ctx.moveTo(sx, sy - 9); ctx.lineTo(sx, sy + 9);
  ctx.stroke();
  ctx.beginPath();
  ctx.arc(sx, sy, 3.2, 0, Math.PI*2);
  ctx.fillStyle = theme.light ? 'rgba(2,132,199,0.95)' : 'rgba(56,189,248,0.95)';
  ctx.fill();
  ctx.restore();
}

function drawGrid(){
  // 网格步长：开启吸附时用吸附步长（所见即所吸附），否则自适应疏密
  let worldStep = null;
  if (snap.on && snap.step * SCALE >= 7) worldStep = snap.step;
  if (worldStep === null){
    worldStep = 1;
    while (worldStep * SCALE < 55) worldStep *= 2;
    while (worldStep * SCALE > 150) worldStep /= 2;
  }
  const step = worldStep * SCALE;
  const ox = ((W/2 - view.cx*SCALE) % step + step) % step;
  const oy = ((H/2 + view.cy*SCALE) % step + step) % step;
  const cv = CV();

  // 细网格
  ctx.strokeStyle = snap.on ? cv.grid : cv.gridPlain;
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = ox; x < W; x += step){ ctx.moveTo(x, 0); ctx.lineTo(x, H); }
  for (let y = oy; y < H; y += step){ ctx.moveTo(0, y); ctx.lineTo(W, y); }
  ctx.stroke();

  // 主网格（每 1 米加亮，便于估算距离）
  if (worldStep < 1){
    const big = SCALE;                      // 1 米
    if (big >= 18){
      const bx = ((W/2 - view.cx*SCALE) % big + big) % big;
      const by = ((H/2 + view.cy*SCALE) % big + big) % big;
      ctx.strokeStyle = cv.gridMajor;
      ctx.beginPath();
      for (let x = bx; x < W; x += big){ ctx.moveTo(x, 0); ctx.lineTo(x, H); }
      for (let y = by; y < H; y += big){ ctx.moveTo(0, y); ctx.lineTo(W, y); }
      ctx.stroke();
    }
  }

  // 原点十字
  const [cx, cy] = w2s(0, 0);
  ctx.strokeStyle = cv.axis;
  ctx.beginPath();
  ctx.moveTo(cx, 0); ctx.lineTo(cx, H);
  ctx.moveTo(0, cy); ctx.lineTo(W, cy);
  ctx.stroke();
}

/* 吸附参考线：青色虚线（网格吸附较淡，智能对齐较亮） */
function drawGuides(){
  if (!guides.length) return;
  ctx.save();
  ctx.setLineDash([5, 5]);
  ctx.lineWidth = 1;
  const cv = CV();
  for (const g of guides){
    ctx.strokeStyle = g.grid ? cv.guideSoft : cv.guide;
    ctx.beginPath();
    if (g.axis === 'x'){
      const [sx] = w2s(g.v, 0);
      ctx.moveTo(sx, 0); ctx.lineTo(sx, H);
    } else {
      const [, sy] = w2s(0, g.v);
      ctx.moveTo(0, sy); ctx.lineTo(W, sy);
    }
    ctx.stroke();
  }
  ctx.setLineDash([]);
  ctx.restore();
}

function fieldColor(c){
  if (c.kind === 'negfield') return theme.light ? '#475569' : '#94a3b8';
  if (c.fieldType === 'E') return theme.light ? '#b45309' : '#f59e0b';
  return theme.light ? '#0369a1' : '#38bdf8';
}

function fieldFillAlpha(c){
  if (c.kind === 'negfield') return theme.light ? 0.15 : 0.11;
  return theme.light ? 0.13 : 0.09;
}

/* =========================================================
   场 / 负场分层渲染
   ---------------------------------------------------------
   负场语义是「该区域场强置零」，所以视觉上不该再盖一层新的场，
   而应该把它下面那一层的场渲染淡化掉。
   做法：所有「场」先画到离屏层 → 负场在该层上 destination-out 挖洞
   → 整层合成回主画布 → 最后在主场画负场的虚线轮廓与名称。
   这样被挖掉的只是场的填充与符号，网格、粒子、手柄都保持清晰。
   ========================================================= */
function drawAllFields(dim){
  const fields = [], negs = [];
  for (const c of state.components){
    if (c.kind === 'field') fields.push(c);
    else if (c.kind === 'negfield') negs.push(c);
  }

  // 没有负场：直接画（省一次全屏合成）
  if (!negs.length || !fieldCtx){
    for (const c of fields){
      ctx.globalAlpha = dim(c.id) ? 0.07 : 1;
      drawFieldComponent(c);
    }
    ctx.globalAlpha = 1;
    return;
  }

  const main = ctx;
  ctx = fieldCtx;
  ctx.clearRect(0, 0, W, H);

  for (const c of fields){
    ctx.globalAlpha = dim(c.id) ? 0.07 : 1;
    drawFieldComponent(c);
  }
  for (const c of negs) carveNegField(c);
  ctx.globalAlpha = 1;

  ctx = main;
  main.drawImage(fieldLayer, 0, 0, W, H);

  for (const c of negs){
    main.globalAlpha = dim(c.id) ? 0.32 : 1;
    drawNegFieldMark(c);
  }
  main.globalAlpha = 1;
}

/* 与各形状的填充区域一致的路径（本地 px 坐标，调用前已 translate/rotate） */
function buildMaskPath(c){
  const S = SCALE;
  const big = Math.hypot(W, H) * 2;
  if (c.shape === 'single')            ctx.rect(0, -big, big, big * 2);
  else if (c.shape === 'double')       ctx.rect(-c.w*S/2, -big, c.w*S, big * 2);
  else if (c.shape === 'singleFinite') ctx.rect(0, -c.h*S/2, big, c.h*S);
  else if (c.shape === 'infinite')     ctx.rect(-W*2, -H*2, W*4, H*4);
  else buildShapePath(c);
}

/* 负场：挖掉 88% 的场渲染，保留极淡痕迹 */
function carveNegField(c){
  const [sx, sy] = w2s(c.x, c.y);
  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(-c.angle);
  ctx.beginPath();
  buildMaskPath(c);
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'rgba(0,0,0,0.88)';
  ctx.fill();
  ctx.restore();
}

/* 负场在主场上的标记：极淡灰底 + 虚线轮廓 + 名称 */
function drawNegFieldMark(c){
  const col = fieldColor(c);
  const [sx, sy] = w2s(c.x, c.y);
  const closed = !OPEN_SHAPES.has(c.shape) && c.shape !== 'infinite';

  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(-c.angle);

  if (closed){
    ctx.beginPath();
    buildMaskPath(c);
    ctx.fillStyle = hexA(col, theme.light ? 0.06 : 0.045);
    ctx.fill();
  }

  if (closed){
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = hexA(col, 0.5);
    ctx.lineWidth = 1.4;
    ctx.stroke();
    ctx.setLineDash([]);
  } else if (OPEN_SHAPES.has(c.shape)){
    drawShortBoundary(c, col);
  }
  ctx.restore();

  drawFieldName(c, col);
}

function drawFieldComponent(c){
  const col = fieldColor(c);
  const [sx, sy] = w2s(c.x, c.y);
  const alpha = fieldFillAlpha(c);

  ctx.save();
  ctx.translate(sx, sy);
  ctx.rotate(-c.angle);

  if (c.shape === 'infinite'){
    ctx.beginPath();
    ctx.rect(-W*2, -H*2, W*4, H*4);
    ctx.fillStyle = hexA(col, alpha * 0.8);
    ctx.fill();
  } else if (OPEN_SHAPES.has(c.shape)){
    // 开放形状（单/双/单有限）：只画淡淡有效区域 + "短边界"标记，不做实体墙
    fillOpenRegion(c, col, alpha);
    drawShortBoundary(c, col);
  } else {
    ctx.beginPath();
    buildShapePath(c);
    ctx.fillStyle = hexA(col, alpha);
    ctx.fill();

    const isSolid = c.boundary === 'solid';
    ctx.setLineDash(isSolid ? [] : [7, 7]);
    if (isSolid){ ctx.shadowColor = hexA(col, 0.5); ctx.shadowBlur = 9; }
    ctx.strokeStyle = hexA(col, isSolid ? 0.95 : 0.62);
    ctx.lineWidth = isSolid ? 2.2 : 1.6;
    ctx.stroke();
    ctx.shadowBlur = 0;
    ctx.setLineDash([]);
  }
  ctx.restore();

  if (c.kind === 'field') drawFieldSymbols(c, col);
  drawFieldName(c, col);
}

/* 开放形状的有效区域填充（本地 px 坐标，随旋转） */
function fillOpenRegion(c, col, alpha){
  const S = SCALE;
  const big = (Math.hypot(W, H) * 2);
  ctx.beginPath();
  if (c.shape === 'single'){
    ctx.rect(0, -big, big, big * 2);
  } else if (c.shape === 'double'){
    ctx.rect(-c.w*S/2, -big, c.w*S, big * 2);
  } else {
    ctx.rect(0, -c.h*S/2, big, c.h*S);
  }
  ctx.fillStyle = hexA(col, alpha);
  ctx.fill();
}

/* 短边界半长（屏幕 px）：单/双边界用固定视觉长度，单有限场按实际长度 */
function shortHalfPx(c){
  if (c.shape === 'singleFinite') return c.h * SCALE / 2;
  return Math.min(H * 0.4, 160);
}

/* 短边界（与单边界同款）：短线段 + 端点刻度，表示"无限延伸"
   单/双边界不具实体碰撞，粒子可直接穿过 */
function drawShortBoundary(c, col){
  const solid = (c.boundary === 'solid') && c.shape === 'singleFinite';
  const half = shortHalfPx(c);
  const xs = (c.shape === 'double') ? [-c.w*SCALE/2, c.w*SCALE/2] : [0];

  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.setLineDash([]);

  // 柔和光晕底
  ctx.strokeStyle = hexA(col, theme.light ? 0.10 : 0.16);
  ctx.lineWidth = solid ? 8 : 7;
  for (const x of xs){
    ctx.beginPath(); ctx.moveTo(x, -half); ctx.lineTo(x, half); ctx.stroke();
  }

  // 主描边
  ctx.setLineDash(solid ? [] : [8, 6]);
  ctx.strokeStyle = hexA(col, solid ? 0.98 : 0.85);
  ctx.lineWidth = solid ? 2.6 : 2.1;
  for (const x of xs){
    ctx.beginPath(); ctx.moveTo(x, -half); ctx.lineTo(x, half); ctx.stroke();
  }
  ctx.setLineDash([]);

  // 端点刻度
  const tk = 10;
  ctx.strokeStyle = hexA(col, solid ? 0.9 : 0.72);
  ctx.lineWidth = 1.7;
  for (const x of xs){
    const dir = (c.shape === 'double') ? (x < 0 ? -1 : 1) : 1;
    ctx.beginPath();
    ctx.moveTo(x, -half); ctx.lineTo(x + dir*tk, -half);
    ctx.moveTo(x,  half); ctx.lineTo(x + dir*tk,  half);
    ctx.stroke();
  }
  ctx.restore();
}

/* 场名称（带半透明底衬） */
function drawFieldName(c, col){
  if (c.shape === 'infinite' || c.shape === 'single' || c.shape === 'double') return;
  const [tx, ty] = w2s(c.x, c.y);
  ctx.font = '12px system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const tw = ctx.measureText(c.name).width;
  const bw = tw + 14, bh = 18, bx = tx - bw/2, by = ty - bh/2;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 6);
  else ctx.rect(bx, by, bw, bh);
  ctx.fillStyle = CV().labelBg;
  ctx.fill();
  ctx.fillStyle = hexA(col, 0.98);
  ctx.fillText(c.name, tx, ty);
}

function buildShapePath(c){
  const S = SCALE;
  switch(c.shape){
    case 'rect': case 'doubleFinite':
      ctx.rect(-c.w*S/2, -c.h*S/2, c.w*S, c.h*S);
      break;
    case 'circle':
      ctx.arc(0, 0, c.r*S, 0, Math.PI*2);
      break;
    case 'ellipse':
      ctx.ellipse(0, 0, c.w*S/2, c.h*S/2, 0, 0, Math.PI*2);
      break;
    case 'sector': {
      const half = c.span * Math.PI / 360;
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, c.r*S, -half, half);
      ctx.closePath();
      break;
    }
    case 'triangle': {
      const v = triVerts(c);
      ctx.moveTo(v[0][0]*S, -v[0][1]*S);
      ctx.lineTo(v[1][0]*S, -v[1][1]*S);
      ctx.lineTo(v[2][0]*S, -v[2][1]*S);
      ctx.closePath();
      break;
    }
    case 'single':
      ctx.moveTo(0, -20000); ctx.lineTo(0, 20000);
      break;
    case 'double':
      ctx.moveTo(-c.w*S/2, -20000); ctx.lineTo(-c.w*S/2, 20000);
      ctx.moveTo( c.w*S/2, -20000); ctx.lineTo( c.w*S/2, 20000);
      break;
    case 'singleFinite': {
      const hh = c.h*S/2;
      ctx.moveTo(0, -hh); ctx.lineTo(0, hh);
      ctx.moveTo(0, -hh); ctx.lineTo(30, -hh);
      ctx.moveTo(0,  hh); ctx.lineTo(30,  hh);
      break;
    }
    case 'infinite':
      ctx.rect(-W, -H, W*2, H*2);
      break;
  }
}

function drawFieldSymbols(c, col){
  const norm = c.fieldType === 'E'
    ? Math.min(1, Math.max(0, Math.log(c.strength/E_MIN) / Math.log(E_MAX/E_MIN)))
    : Math.min(1, Math.max(0, Math.log(c.strength/B_MIN) / Math.log(B_MAX/B_MIN)));

  // 符号间距（世界单位）：场强越大越密；对齐世界网格 → 平移/缩放时符号跟随场体
  let sp = 0.62 - 0.34 * norm;              // 米
  while (sp * SCALE < 26) sp *= 1.35;       // 屏幕最小间距，避免过密

  const [minx, miny, maxx, maxy] = shapeWorldBBox(c);
  const x0 = Math.ceil(minx / sp) * sp;
  const y0 = Math.ceil(miny / sp) * sp;

  const arrowLen = clamp(sp * SCALE * 0.42, 8, 20);
  const half = arrowLen / 2;
  const ah = Math.min(7, arrowLen * 0.34);

  ctx.save();
  ctx.strokeStyle = hexA(col, 0.72);
  ctx.fillStyle = hexA(col, 0.72);
  ctx.lineWidth = 1.6;
  ctx.lineCap = 'round';

  if (c.fieldType === 'E'){
    const ang = c.fieldAngle;
    const dx = Math.cos(ang), dy = -Math.sin(ang);
    for (let wy = y0; wy <= maxy; wy += sp){
      for (let wx = x0; wx <= maxx; wx += sp){
        if (!insideShape(c, wx, wy)) continue;
        const [sx, sy] = w2s(wx, wy);
        const tx = sx - dx*half, ty = sy - dy*half;
        const hx = sx + dx*half, hy = sy + dy*half;
        ctx.beginPath();
        ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();
        const a1 = ang + Math.PI*0.82, a2 = ang - Math.PI*0.82;
        ctx.beginPath();
        ctx.moveTo(hx, hy);
        ctx.lineTo(hx + Math.cos(a1)*ah, hy - Math.sin(a1)*ah);
        ctx.moveTo(hx, hy);
        ctx.lineTo(hx + Math.cos(a2)*ah, hy - Math.sin(a2)*ah);
        ctx.stroke();
      }
    }
  } else {
    const out = c.bDir > 0;
    const r = clamp(sp * SCALE * 0.10, 2, 6);
    for (let wy = y0; wy <= maxy; wy += sp){
      for (let wx = x0; wx <= maxx; wx += sp){
        if (!insideShape(c, wx, wy)) continue;
        const [sx, sy] = w2s(wx, wy);
        ctx.beginPath();
        if (out){
          ctx.arc(sx, sy, r, 0, Math.PI*2);
          ctx.fill();
        } else {
          const d = r + 1.1;
          ctx.moveTo(sx-d, sy-d); ctx.lineTo(sx+d, sy+d);
          ctx.moveTo(sx+d, sy-d); ctx.lineTo(sx-d, sy+d);
          ctx.stroke();
        }
      }
    }
  }
  ctx.restore();
}

/* 场的世界坐标包围盒（无限类场取当前可见区域） */
function shapeWorldBBox(c){
  const [ax, ay] = s2w(0, 0);
  const [bx, by] = s2w(W, H);
  let minx = Math.min(ax, bx), maxx = Math.max(ax, bx);
  let miny = Math.min(ay, by), maxy = Math.max(ay, by);

  const unbounded = (c.shape === 'infinite' || c.shape === 'single' ||
                     c.shape === 'double'   || c.shape === 'singleFinite');
  if (unbounded) return [minx, miny, maxx, maxy];

  let hw, hh;
  if (c.shape === 'circle' || c.shape === 'sector'){ hw = hh = c.r; }
  else { hw = c.w/2; hh = c.h/2; }

  let mnx = 1e9, mxx = -1e9, mny = 1e9, mxy = -1e9;
  const corners = [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]];
  for (const [lx, ly] of corners){
    const [wx, wy] = toWorld(c, lx, ly);
    mnx = Math.min(mnx, wx); mxx = Math.max(mxx, wx);
    mny = Math.min(mny, wy); mxy = Math.max(mxy, wy);
  }
  return [Math.max(minx, mnx), Math.max(miny, mny),
          Math.min(maxx, mxx), Math.min(maxy, mxy)];
}

function drawObstacle(c){
  const dx = Math.cos(c.angle)*c.len/2;
  const dy = Math.sin(c.angle)*c.len/2;
  const [ax, ay] = w2s(c.x - dx, c.y - dy);
  const [bx, by] = w2s(c.x + dx, c.y + dy);

  const cv = CV();
  // 外发光：让"实体墙"在两种底色上都清楚
  ctx.strokeStyle = theme.light ? 'rgba(255,255,255,0.9)' : 'rgba(15,23,42,0.75)';
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
  ctx.stroke();

  ctx.strokeStyle = cv.obstacle;
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
  ctx.stroke();

  ctx.strokeStyle = cv.obstacle2;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
  ctx.stroke();
}

function drawEmitter(em){
  const [sx, sy] = w2s(em.x, em.y);
  const col = theme.light ? shade(em.color, 0.78) : em.color;

  if (em.mode === 'line'){
    const dx = Math.cos(em.lineAngle*Math.PI/180) * em.lineLength/2;
    const dy = Math.sin(em.lineAngle*Math.PI/180) * em.lineLength/2;
    const [ax, ay] = w2s(em.x - dx, em.y - dy);
    const [bx, by] = w2s(em.x + dx, em.y + dy);
    ctx.strokeStyle = hexA(col, 0.55);
    ctx.lineWidth = 2;
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.setLineDash([]);
  }

  const ang = em.vAngle * Math.PI/180;
  const dx = Math.cos(ang), dy = -Math.sin(ang);
  const L = 34;
  const ex = sx + dx*L, ey = sy + dy*L;

  ctx.strokeStyle = col;
  ctx.fillStyle = col;
  ctx.lineWidth = 2.2;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();

  const a1 = ang + Math.PI*0.82, a2 = ang - Math.PI*0.82;
  ctx.beginPath();
  ctx.moveTo(ex, ey);
  ctx.lineTo(ex + Math.cos(a1)*9, ey - Math.sin(a1)*9);
  ctx.lineTo(ex + Math.cos(a2)*9, ey - Math.sin(a2)*9);
  ctx.closePath();
  ctx.fill();

  ctx.beginPath();
  ctx.arc(sx, sy, 6, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = CV().handleBd;
  ctx.lineWidth = 1.6;
  ctx.stroke();

  ctx.font = '12px system-ui,sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const tw = ctx.measureText(em.name).width;
  const bw = tw + 12, bh = 17, bx = sx - bw/2, by = sy + 22 - bh/2;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 6);
  else ctx.rect(bx, by, bw, bh);
  ctx.fillStyle = CV().labelBg;
  ctx.fill();
  ctx.fillStyle = hexA(col, 0.95);
  ctx.fillText(em.name, sx, sy + 22);
}

function drawParticles(){
  const colOf = p => theme.light ? shade(p.color, 0.8) : p.color;
  for (let i = 0; i < particles.length; i++){
    const p = particles[i];
    const pc = colOf(p);
    if (p.trailMode === 'none' || p.trailMode === 'endpoint') continue;
    const t = p.trail;
    if (t.length < 2) continue;

    ctx.lineWidth = 1.6;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';

    if (p.trailMode === 'dashed'){
      ctx.setLineDash([5,5]);
      ctx.strokeStyle = hexA(pc, 0.85);
      ctx.beginPath();
      let [sx, sy] = w2s(t[0][0], t[0][1]);
      ctx.moveTo(sx, sy);
      for (let k = 1; k < t.length; k++){
        [sx, sy] = w2s(t[k][0], t[k][1]);
        ctx.lineTo(sx, sy);
      }
      ctx.stroke();
      ctx.setLineDash([]);
    }
    else if (p.trailMode === 'fade'){
      const step = Math.max(1, Math.floor(t.length / 120));
      for (let k = step; k < t.length; k += step){
        const a = (k / t.length) * 0.85;
        const [x1, y1] = w2s(t[k-step][0], t[k-step][1]);
        const [x2, y2] = w2s(t[k][0], t[k][1]);
        ctx.strokeStyle = hexA(pc, a);
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      }
    }
    else {
      ctx.strokeStyle = hexA(pc, 0.8);
      ctx.beginPath();
      let [sx, sy] = w2s(t[0][0], t[0][1]);
      ctx.moveTo(sx, sy);
      for (let k = 1; k < t.length; k++){
        [sx, sy] = w2s(t[k][0], t[k][1]);
        ctx.lineTo(sx, sy);
      }
      ctx.stroke();
    }
  }

  for (let i = 0; i < particles.length; i++){
    const p = particles[i];
    const pc = colOf(p);
    const [sx, sy] = w2s(p.x, p.y);
    const r = p.stopped ? 2.6 : 3.2;

    ctx.beginPath();
    ctx.arc(sx, sy, r, 0, Math.PI*2);
    ctx.fillStyle = pc;
    ctx.fill();

    if (p.stopped){
      ctx.beginPath();
      ctx.arc(sx, sy, r + 2.5, 0, Math.PI*2);
      ctx.strokeStyle = hexA(pc, 0.7);
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
  }
}

/* =========================================================
   手柄（世界坐标）
   type: sx/sx- 左右边中点  sy/sy- 上下边中点
         ne/se/sw/nw 角点    r 半径   sp1/sp2 扇形张角
         apex/bl/br 三角形顶点  rot 旋转  o1/o2 障碍端点  dir 发射方向
   ========================================================= */
function handlePoints(c){
  const pts = [];
  const P = (lx, ly, extra) => {
    const [x, y] = toWorld(c, lx, ly);
    pts.push(Object.assign({ x, y }, extra));
  };

  if (c.kind === 'field' || c.kind === 'negfield'){
    const s = c.shape;

    // 电场方向手柄（绝对世界角度，与形状角度解耦；负场无方向）
    if (c.kind === 'field' && c.fieldType === 'E' && c.strength > 0){
      // 半径取「短边的一半」的一半左右，避开边缘手柄
      const minExt = (s === 'circle' || s === 'sector') ? c.r : Math.min(c.w/2, c.h/2);
      const R = clamp(minExt * 0.55, 0.3, 1.0);
      pts.push({
        type:'fdir',
        x: c.x + Math.cos(c.fieldAngle) * R,
        y: c.y + Math.sin(c.fieldAngle) * R,
      });
    }

    if (s === 'infinite') return pts;

    if (s === 'single'){
      P(0.9, 0, { type:'rot' });          // 无限长边界：只能旋转
      return pts;
    }
    if (s === 'double'){
      const hw = c.w/2;
      P( hw, 0, { type:'sx' });
      P(-hw, 0, { type:'sx-' });
      P( hw + 0.7, 0, { type:'rot' });
      return pts;
    }
    if (s === 'singleFinite'){
      const hh = c.h/2;
      P(0,  hh, { type:'sy' });
      P(0, -hh, { type:'sy-' });
      P(0.9, 0, { type:'rot' });
      return pts;
    }
    if (s === 'circle'){
      for (const a of [0, 90, 180, 270]){
        const r = a * Math.PI/180;
        P(Math.cos(r)*c.r, Math.sin(r)*c.r, { type:'r' });
      }
      return pts;
    }
    if (s === 'sector'){
      const half = c.span * Math.PI / 360;
      P(c.r, 0, { type:'r' });
      P(Math.cos(half)*c.r,  Math.sin(half)*c.r,  { type:'sp1' });
      P(Math.cos(-half)*c.r, Math.sin(-half)*c.r, { type:'sp2' });
      P(c.r + 0.75, 0, { type:'rot' });
      return pts;
    }
    if (s === 'triangle'){
      const v = triVerts(c);
      P(v[0][0], v[0][1], { type:'v0' });
      P(v[1][0], v[1][1], { type:'v1' });
      P(v[2][0], v[2][1], { type:'v2' });
      // 旋转环放在最远顶点外侧
      let far = 0, fi = 0;
      v.forEach((pt, i) => { const d = Math.hypot(pt[0], pt[1]); if (d > far){ far = d; fi = i; } });
      const ux = far > 1e-6 ? v[fi][0]/far : 1, uy = far > 1e-6 ? v[fi][1]/far : 0;
      P(v[fi][0] + ux*0.6, v[fi][1] + uy*0.6, { type:'rot' });
      return pts;
    }

    // rect / ellipse / doubleFinite：4 角 + 4 边中点 + 旋转
    const hw = c.w/2, hh = c.h/2;
    P( hw,  hh, { type:'ne' });
    P( hw, -hh, { type:'se' });
    P(-hw, -hh, { type:'sw' });
    P(-hw,  hh, { type:'nw' });
    P( hw, 0, { type:'sx' });
    P(0,  hh, { type:'sy' });
    P(-hw, 0, { type:'sx-' });
    P(0, -hh, { type:'sy-' });
    P(Math.max(hw, hh) + 0.7, 0, { type:'rot' });
    return pts;
  }

  if (c.kind === 'obstacle'){
    P(-c.len/2, 0, { type:'o1' });
    P( c.len/2, 0, { type:'o2' });
    P( c.len/2 + 0.55, 0, { type:'rot' });
    return pts;
  }

  if (c.kind === 'emitter'){
    // 方向手柄跟随发射角，长度与箭头一致（屏幕像素换算到世界）
    const ang = c.vAngle * Math.PI / 180;
    const L = 34/SCALE + 0.2;
    pts.push({ type:'dir', x: c.x + Math.cos(ang)*L, y: c.y + Math.sin(ang)*L });
    return pts;
  }
  return pts;
}

/* 手柄外观 */
const HANDLE_STYLE = {
  rot:  { color:'#f59e0b', shape:'rot' },
  fdir: { color:'#fbbf24', shape:'dot' },
  r:    { color:'#38bdf8', shape:'dot' },
  sp1:  { color:'#e879f9', shape:'dot' },
  sp2:  { color:'#e879f9', shape:'dot' },
  v0:   { color:'#7dd3fc', shape:'square' },
  v1:   { color:'#7dd3fc', shape:'square' },
  v2:   { color:'#7dd3fc', shape:'square' },
  o1:   { color:'#22d3ee', shape:'dot' },
  o2:   { color:'#22d3ee', shape:'dot' },
  dir:  { color:'#a3e635', shape:'dir' },
};
function handleStyle(t){
  const base = HANDLE_STYLE[t] ||
    ((t === 'ne' || t === 'nw' || t === 'se' || t === 'sw' || t[0] === 'v')
      ? { color:'#60a5fa', shape:'square' }
      : { color:'#38bdf8', shape:'dot' });
  return { color: tc(base.color), shape: base.shape };
}

function drawHandles(c){
  const pts = handlePoints(c);
  if (!pts.length) return;

  // 角度参考轴：便于理解 0° 方向（本地 +x 轴）
  const hasAngle = c.kind === 'obstacle' ||
    ((c.kind === 'field' || c.kind === 'negfield') && c.shape !== 'circle' && c.shape !== 'infinite');
  if (hasAngle){
    const [ax, ay] = w2s(c.x, c.y);
    const [bx, by] = w2s(...toWorld(c, 1.1, 0));
    ctx.save();
    ctx.setLineDash([4, 4]);
    ctx.strokeStyle = theme.light ? 'rgba(71,85,105,0.35)' : 'rgba(148,163,184,0.38)';
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
  }

  ctx.save();
  for (const pt of pts){
    const [sx, sy] = w2s(pt.x, pt.y);
    const st = handleStyle(pt.type);

    if (st.shape === 'square'){
      ctx.beginPath();
      ctx.rect(sx - 5, sy - 5, 10, 10);
    } else if (st.shape === 'rot'){
      ctx.beginPath();
      ctx.arc(sx, sy, 6.5, 0, Math.PI*2);
      ctx.fillStyle = theme.light ? 'rgba(255,255,255,.92)' : 'rgba(15,23,42,.85)';
      ctx.fill();
      ctx.strokeStyle = st.color;
      ctx.lineWidth = 2.2;
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(sx, sy, 2.2, 0, Math.PI*2);
      ctx.fillStyle = st.color;
      ctx.fill();
      continue;
    } else if (st.shape === 'dir'){
      ctx.beginPath();
      ctx.arc(sx, sy, 5.5, 0, Math.PI*2);
    } else {
      ctx.beginPath();
      ctx.arc(sx, sy, 5.2, 0, Math.PI*2);
    }

    ctx.fillStyle = st.color;
    ctx.fill();
    ctx.strokeStyle = CV().handleBd;
    ctx.lineWidth = 1.7;
    ctx.stroke();
  }
  ctx.restore();
}

/* =========================================================
   工具函数
   ========================================================= */
function hexA(hex, a){
  const n = parseInt(hex.slice(1), 16);
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return `rgba(${r},${g},${b},${a})`;
}

/* =========================================================
   主循环
   ========================================================= */
let lastT = performance.now();
let charging = false, chargeStart = 0;
const CHARGE_MS = 900;              // 长按蓄力时长

function loop(t){
  const dt = Math.min(0.05, (t - lastT) / 1000);
  lastT = t;

  if (state.running) simulate(dt);
  render();

  if (charging) updateCharge(t);

  requestAnimationFrame(loop);
}

/* =========================================================
   模拟控制：悬浮圆形按钮（开始 / 暂停 / 长按清空）
   ========================================================= */
const playBtn = document.getElementById('playBtn');
const playWrap = document.getElementById('playWrap');
const chargeRing = document.getElementById('chargeRing');

/* 运行中显示"暂停"两道杠，停止时显示"开始"三角 */
function updatePlayBtn(){
  playBtn.classList.toggle('running', !!state.running);
  playBtn.setAttribute('aria-label', state.running ? '暂停' : '开始');
  playBtn.title = state.running ? '点击暂停 · 长按清空重置' : '点击开始 · 长按清空重置';
}

function updateCharge(t){
  const prog = Math.min(1, (t - chargeStart) / CHARGE_MS);
  chargeRing.style.setProperty('--cp', (prog * 100).toFixed(1));
  playBtn.style.background = mixHex('#2563eb', '#ef4444', prog);
  if (prog >= 1){
    charging = false;
    playBtn.style.background = '';
    playWrap.classList.remove('charging');
    chargeRing.style.setProperty('--cp', 0);
    resetSimulation();
  }
}

function resetSimulation(){
  particles = [];
  state.simTime = 0;
  state.running = false;
  for (const c of state.components){
    if (c.kind === 'emitter'){ c.acc = 0; c.emittedOnce = false; }
  }
  updatePlayBtn();
  playBtn.animate(
    [{transform:'scale(1)'},{transform:'scale(1.24)'},{transform:'scale(.9)'},{transform:'scale(1)'}],
    {duration:380, easing:'ease-out'}
  );
  showHint('已清空全部粒子与轨迹 · 点击 ▶ 重新开始');
}

playBtn.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  if (charging) return;
  charging = true;
  chargeStart = performance.now();
  chargeRing.style.setProperty('--cp', 0);
  playWrap.classList.add('charging');
  try { playBtn.setPointerCapture(e.pointerId); } catch(_){}
});

function endCharge(e, cancelled){
  if (!charging) return;
  const dur = performance.now() - chargeStart;
  charging = false;
  playBtn.style.background = '';
  playWrap.classList.remove('charging');
  chargeRing.style.setProperty('--cp', 0);
  // 未蓄满 → 视为点击：切换 开始 / 暂停
  if (!cancelled && dur < CHARGE_MS){
    state.running = !state.running;
    updatePlayBtn();
  }
  try { playBtn.releasePointerCapture(e.pointerId); } catch(_){}
}
playBtn.addEventListener('pointerup', e => endCharge(e, false));
playBtn.addEventListener('pointercancel', e => endCharge(e, true));
playBtn.addEventListener('contextmenu', e => e.preventDefault());

/* =========================================================
   模拟速率：单个可拖动进度条（颜色随进度由蓝转红）
   ========================================================= */
const speedRange = document.getElementById('speedRange');
const speedVal = document.getElementById('speedVal');
const SPEED_MIN = 0.01, SPEED_MAX = 3;

function speedToSlider(v){
  return Math.round((Math.log(v/SPEED_MIN) / Math.log(SPEED_MAX/SPEED_MIN)) * 99) + 1;
}
function sliderToSpeed(s){
  return SPEED_MIN * Math.pow(SPEED_MAX/SPEED_MIN, (s-1)/99);
}

function updateSpeedFill(){
  const s = parseFloat(speedRange.value);
  const p = clamp((s - 1) / 99, 0, 1);
  speedRange.style.setProperty('--p', (p*100).toFixed(2) + '%');
  speedRange.style.setProperty('--fill', rampColor(p));
}

function setSpeed(v){
  state.speed = clamp(v, SPEED_MIN, SPEED_MAX);
  speedRange.value = speedToSlider(state.speed);
  speedVal.textContent = state.speed.toFixed(2) + '×';
  updateSpeedFill();
}

speedRange.addEventListener('input', () => {
  setSpeed(sliderToSpeed(parseFloat(speedRange.value)));
});
speedRange.addEventListener('pointerdown', () => speedRange.classList.add('dragging'));
window.addEventListener('pointerup', () => speedRange.classList.remove('dragging'));
setSpeed(0.2);

/* =========================================================
   左侧类别与图例
   ========================================================= */
const legend = document.getElementById('legend');
const catBtns = document.querySelectorAll('.catBtn');

const CAT_ITEMS = {
  field: Object.keys(SHAPES),
  negative: Object.keys(SHAPES),
  obstacle: ['line'],
  emitter: ['single','angles','speeds','line'],
};

const EMITTER_LABEL = {
  single: '点发射器',
  angles: '不同角度发射器',
  speeds: '不同速度发射器',
  line: '线状发射器',
};

let currentCat = null;

catBtns.forEach(btn => {
  btn.onclick = () => {
    const cat = btn.dataset.cat;
    if (currentCat === cat){
      currentCat = null;
      btn.classList.remove('on');
      legend.innerHTML = '';
      return;
    }
    currentCat = cat;
    catBtns.forEach(b => b.classList.toggle('on', b === btn));
    buildLegend(cat);
  };
});

function buildLegend(cat){
  legend.innerHTML = '';
  const items = CAT_ITEMS[cat];
  items.forEach((key, idx) => {
    const d = document.createElement('div');
    d.className = 'legendItem';
    if (cat === 'obstacle') d.textContent = '线形障碍';
    else if (cat === 'emitter') d.textContent = EMITTER_LABEL[key];
    else d.textContent = SHAPES[key].name;

    d.onclick = () => {
      legend.querySelectorAll('.legendItem').forEach(x => x.classList.remove('on'));
      d.classList.add('on');
      state.pending = { cat, key };
      showHint('点击画布放置 ' + d.textContent);
    };
    d.style.animationDelay = (idx * 16) + 'ms';
    legend.appendChild(d);
  });
}

   提示

const hintEl = document.getElementById('hint');
let hintTimer = null;
function showHint(text){
  hintEl.textContent = text;
  hintEl.style.opacity = '1';
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => { hintEl.style.opacity = '0'; }, 2200);
